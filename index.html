            // 3. ★ 核心重构：真正的动态上下文扫描 & 完整内容注入（废除 100 字暴力截断）
            //    提取最近的 3 轮对话，用 simulateScan 扫描触发关键词
            const recentHistoryText = chatMessages.slice(-3).map(m => m.content).join('\n');
            const hits = simulateScan(recentHistoryText);
            const currentEntry = getCurrentEntry(); // 当前正在编辑的条目（所见即所得）
            let injectedEntries = [];

            // 注入命中条目的【完整内容】，拒绝暴力截断
            hits.forEach(hit => {
                // 🚀 修复1：将 UID 与标题绑定注入，赋予 AI 辨识现有条目的能力（防幽灵新建）
                injectedEntries.push(`[UID:${hit.entry.uid} | 标题:${hit.entry.keys[0]}]\n${hit.entry.content}`);

                injectedEntries.push(`[当前聚焦 | UID:${currentEntry.uid} | 标题:${currentEntry.keys[0] || '未命名'}]\n${currentEntry.content}`);
            }

            if (injectedEntries.length > 0) {
                systemPrompts.push(`【当前激活的世界观上下文】\n请严格参考以下设定进行创作与回复：\n\n${injectedEntries.join('\n\n---\n\n')}`);
            } else {
                systemPrompts.push(`【当前激活的世界观上下文】\n(当前对话未触发任何特定设定，请根据基础设定自由发挥)`);
            }

            // ===== 🚀 新增：全局目录雷达（赋予 AI 上帝视角） =====
            const allEntriesList = getEntriesArray();
            if (allEntriesList.length > 0) {
                // 将所有条目压缩成 "UID:标题" 的轻量级字符串
                const catalogStr = allEntriesList.map(e => `${e.uid}:${(Array.isArray(e.keys) && e.keys[0]) ? e.keys[0] : '未命名'}`).join(', ');
                systemPrompts.push(`【全局目录雷达】(赋予你的全局视野)\n当前工作台包含以下所有条目(UID:主触发词)：\n${catalogStr}\n\n[指令：当用户要求“遍历/检查/合并/梳理”条目时，请根据此目录推演。若需合并，你可以直接结合 UID 调用 update_worldbook 进行操作（如：更新条目A，删除多余的条目B）。]`);
            }
            // ===== 🚀 新增结束 =====

            // 4. 初始化要发给 API 的 Messages 数组
            const systemPromptText = systemPrompts.join('\n\n=====\n\n');
            let apiMessages = [
                { role: 'system', content: systemPromptText }
            ];

            // 5. 注入历史聊天记录 (限制近 10 条防止 Token 撑爆)
            //    🚀 隔离占位符：占位气泡已在构建 apiMessages 之后才 push，此处再加一道防御，
            //    任何异常路径（并发/残留）下都绝不把 '...' 占位消息发给 API，从源头杜绝 400。
            const maxHistoryLength = 10;
            const history = chatMessages.slice(-maxHistoryLength)
                .filter(m => m && !m._pending && m.content !== '...')
                .map(msg => ({ role: msg.role, content: msg.content }));
            apiMessages.push(...history);

            // 定义结构化的原生工具 Schema（原生 Function Calling / Tool Calling）
            // 让助手通过标准 JSON 协议交互数据，而不是手写 Markdown 代码块
            const dbUpdateTool = [{
                type: "function",
                function: {
                    name: "update_worldbook",
                    description: "当用户要求修改、添加或删除世界观设定时，必须调用此原生函数进行数据交互，绝对不要在文本中输出 JSON 代码块。",
                    parameters: {
                        type: "object",
                        properties: {
                            worldbook_updates: {
                                type: "array",
                                description: "需要操作的世界书条目列表",
                                items: {
                                    type: "object",
                                    properties: {
                                        action: { type: "string", enum: ["add_or_update", "delete"] },
                                        // 🚀 修复1：赋予 AI UID 辨识能力，解决“幽灵新建”问题
                                        uid: { type: "string", description: "要操作条目的 UID（更新或删除现有条目时必填；新建留空）" },
                                        title: { type: "string", description: "设定的主标题/主触发词" },
                                        keys: { type: "array", items: { type: "string" }, description: "相关触发词" },
                                        content: { type: "string", description: "设定正文" },
                                        depth: { type: "number", description: "插入深度，推荐 4" },
                                        order: { type: "number", description: "注入顺序，推荐 100" },
                                        position: { type: "number", description: "1: 角色前, 2: 角色后" }
                                    },
                                    required: ["action", "title", "content"]
                                }
                            },
                            reply_text: {
                                type: "string",
                                description: "以助手的语气对用户进行口语化回复（如：好的，已为您添加某某设定）。"
                            }
                        },
                        required: ["reply_text"]
                    }
                }
            }];

            // 6. ★ 原生工具指令：读写模式强制走 Function Calling，只读模式禁止调用
            let metaInstruction = "";
            if (allowModify) {
                metaInstruction = `

[系统隐秘指令：如果您需要变更设定，必须且只能调用提供的 update_worldbook 原生函数，切勿手写 JSON/YAML Markdown 代码块！每次调用时请在参数中附带 reply_text 用于回复用户。更新或删除现有条目时，务必从激活上下文读取该条目的 UID 填入 uid 字段，防止误建幽灵条目。]`;
            } else {
                metaInstruction = `

[⚠️ 当前为安全只读模式] 你已被剥夺数据修改权限，请绝对不要调用任何工具或输出任何操作代码块，单纯沉浸在你的预设角色中与用户交流。`;
            }

            // 将轻量级提醒挂在最后一条消息末尾
            if (apiMessages.length > 0 && apiMessages[apiMessages.length - 1].role === 'user') {
                apiMessages[apiMessages.length - 1].content += metaInstruction;
            }

            try {
                // 提前推入一个占位气泡，配合流式回调实时更新 DOM（告别“死机等待”）
                chatMessages.push({ role: 'assistant', content: '...', _pending: true });
                renderChatMessages();

                // 呼叫 API 并传入流式回调 + 工具箱（读写模式挂载原生 update_worldbook 工具）
                const responseObj = await fetchAICompletion('设定交流助手', apiMessages, (partialText, isToolCalling) => {
                    const cur = chatMessages[chatMessages.length - 1];
                    if (cur && cur.role === 'assistant') cur.content = partialText || '';
                    const chatContainer = document.getElementById('chatMessages');
                    if (!chatContainer) return;
                    const bubbles = chatContainer.querySelectorAll('.chat-row.assistant .chat-bubble');
                    if (bubbles.length > 0) {
                        const lastBubble = bubbles[bubbles.length - 1];
                        // 🚀 修复1（流式）：仅屏蔽未闭合的 <think>，绝对保留 AI 所有的 Markdown 格式和代码块！
                        const streamDisplay = String(partialText || '').replace(/<think>[\s\S]*?(?:<\/think>|$)/gi, '').trim();
                        // 🚀 修复4：交互增强——工具装配动画 + 思考白屏填充
                        if (isToolCalling && !streamDisplay) {
                            lastBubble.innerHTML = '<span style="color: var(--accent);">⚙️ 正在调用原生数据库接口装配设定...</span>';
                        } else if (!streamDisplay && String(partialText || '').includes('<think>')) {
                            lastBubble.innerHTML = '<span style="color: var(--text-muted);">🧠 深度思考/查阅记忆中...</span>';
                        } else {
                            lastBubble.innerHTML = (typeof marked !== 'undefined' && marked.parse) ? marked.parse(streamDisplay) : escHtml(streamDisplay);
                        }
                    }
                    const anchor = document.getElementById('chatAnchor');
                    if (anchor) anchor.scrollIntoView({ behavior: 'auto' });
                }, allowModify ? dbUpdateTool : null);
                if (!responseObj) {
                    // 请求失败：移除占位气泡，避免残留
                    const pend = chatMessages[chatMessages.length - 1];
                    if (pend && pend._pending) chatMessages.pop();
                    renderChatMessages();
                    return;
                }

                // 7. 结果归一化：可能是 {content, toolCalls}（挂载工具）或纯字符串（旧路径）
                const rawAiText = (responseObj && typeof responseObj === 'object') ? String(responseObj.content || '') : String(responseObj || '');
                // 🚀 引擎核心：优先拦截原生 Function Calling 返回的参数
                let toolArgs = null;
                if (responseObj && typeof responseObj === 'object' && Array.isArray(responseObj.toolCalls) && responseObj.toolCalls.length > 0) {
                    try {
                        toolArgs = JSON.parse(responseObj.toolCalls[0].function.arguments);
                    } catch (err) {
                        console.warn("API 工具参数解析异常，降级为文本提取:", err);
                        toolArgs = null;
                    }
                }

                // 终态显示：只剥除思考过程，保留一切正文、表格、JSON/YAML 代码块等预设格式
                let displayReplyText = rawAiText
                    // 1. 剔除标准的 <think>...</think> 标签及其内部所有内容
                    .replace(/<think>[\s\S]*?<\/think>/gi, '')
                    // 2. 暴力兼容：AI 若仍输出 [metacognition] 等无闭合思考，截断到连续两个换行符
                    .replace(/\[metacognition\][\s\S]*?\n\n/gi, '')
                    .trim();
                let chatReplyText = displayReplyText;
                // 用工具内部附带的话语作为气泡文字
                if (toolArgs && toolArgs.reply_text) chatReplyText = String(toolArgs.reply_text);
                // 容错：AI 偷懒只发 JSON 导致文本为空时，提供兜底回复
                if (!chatReplyText || chatReplyText.length === 0) {
                    chatReplyText = "✅ 数据库已更新，请查阅。";
                }
                // 附带完整原始回复与隐藏上下文（供「🕵️ 详情」查看）
                // 若流式占位气泡仍在，则原位回填，避免出现重复气泡
                const injectedTitles = injectedEntries.map(s => {
                    const m = String(s).match(/^\[([^\]]+)\]/);
                    return m ? m[1] : '未命名';
                });
                const msgData = {
                    role: 'assistant',
                    content: chatReplyText,
                    _raw: rawAiText,                                  // 完整原始 AI 回复（含 think 块与 JSON，已从显示区剥离）
                    _system: systemPromptText,                        // 本次实际发送的系统提示词
                    _meta: metaInstruction,                           // 隐藏元指令（追加在最后一条用户消息末尾）
                    _mode: allowModify ? '读写' : '只读',
                    _historyCount: history.length,                    // 发送的历史消息条数
                    _injectedCount: injectedEntries.length,           // 注入的设定条目数
                    _injectedTitles: injectedTitles                   // 注入条目名称清单
                };
                const pendingMsg = chatMessages[chatMessages.length - 1];
                if (pendingMsg && pendingMsg._pending) {
                    Object.assign(pendingMsg, msgData);
                    delete pendingMsg._pending;
                } else {
                    chatMessages.push(msgData);
                }
                renderChatMessages();

                // 只读模式：不执行任何数据修改
                if (!allowModify) return;

                let hiddenApplied = false; // 记录本次是否实际向工作台写入了修改（供详情查看）

                // B. 提取静默注入指令（★ 原生工具参数优先，旧版文本引擎兜底）
                const aiReplyText = String(rawAiText);
                let parsedData = toolArgs; // 原生 Function Calling 参数优先
                try {
                    // 原生工具参数已就绪时，直接跳过文本候选池
                    if (!parsedData) {
                    // 1. 将全文及提取出的所有独立代码块，放入“候选解析池”
                    const codeBlocks = [];
                    const blockRegex = /```(?:json|yaml|yml)?\s*([\s\S]*?)\s*```/gi;
                    let blockMatch;
                    while ((blockMatch = blockRegex.exec(aiReplyText)) !== null) {
                        if (blockMatch[1] && blockMatch[1].trim()) codeBlocks.push(blockMatch[1].trim());
                    }
                    // 全文兜底：剥除思考过程后整体作为候选
                    const fullText = aiReplyText
                        .replace(/<think>[\s\S]*?<\/think>/gi, '')
                        .replace(/\[metacognition\][\s\S]*?\]/gi, '')
                        .trim();
                    if (fullText) codeBlocks.push(fullText);

                    // 2. 遍历所有候选内容，寻找合法操作指令
                    for (let source of codeBlocks) {
                        // 引擎 A：智能 JSON 提取与纠错（括号深度精准定位，避免贪婪误吞尾部内容）
                        const firstBrace = source.indexOf('{');
                        if (firstBrace > -1) {
                            let depth = 0, inString = false, escaped = false, endIdx = -1;
                            for (let i = firstBrace; i < source.length; i++) {
                                const ch = source[i];
                                if (inString) {
                                    if (escaped) escaped = false;
                                    else if (ch === '\\') escaped = true;
                                    else if (ch === '"') inString = false;
                                } else {
                                    if (ch === '"') inString = true;
                                    else if (ch === '{') depth++;
                                    else if (ch === '}') {
                                        depth--;
                                        if (depth === 0) { endIdx = i; break; }
                                    }
                                }
                            }
                            if (endIdx > -1) {
                                let jsonCandidate = source.substring(firstBrace, endIdx + 1);
                                // 【语法容错】：自动修复 AI 常犯的 JSON 尾随逗号错误 (Trailing Comma)
                                let attempt = jsonCandidate.replace(/,\s*([\}\]])/g, '$1');
                                for (let i = 0; i < 3; i++) {
                                    try {
                                        const obj = JSON.parse(attempt);
                                        if (obj && typeof obj === 'object' && !Array.isArray(obj)) { parsedData = obj; break; }
                                    } catch (e) {
                                        // 容错：去掉尾部多余的逗号或非闭合字符
                                        const stripped = attempt.replace(/[\},]\s*$/, '}');
                                        if (stripped === attempt) break;
                                        attempt = stripped;
                                    }
                                }
                                if (parsedData) break;
                            }
                        }

                        // 引擎 B：JSON 失败时，用 YAML 行级状态机兜底
                        if (!parsedData) {
                            const yamlResult = parseYamlInstructions(source);
                            if (yamlResult && Array.isArray(yamlResult.worldbook_updates) && yamlResult.worldbook_updates.length > 0) {
                                parsedData = yamlResult;
                                break;
                            }
                        }
                    }
                    } // 结束 if(!parsedData)：工具参数已就绪时跳过文本解析
                } catch (err) {
                    console.warn("⚠️ 双向引擎解析告警:", err);
                    parsedData = null;
                }

                // 只有成功解析出合法操作对象时才执行静默注入
                if (parsedData && typeof parsedData === 'object' && !Array.isArray(parsedData)) {
                    const operations = parsedData;
                    let modifiedWorldbook = false;
                    let modifiedPrompts = false;

                    // ① 世界书增删改
                    if (Array.isArray(operations.worldbook_updates) && operations.worldbook_updates.length > 0) {
                        const entriesArr = getEntriesArray();
                        const wb = getCurrentWorldbook();
                        operations.worldbook_updates.forEach(op => {
                            const idx = entriesArr.findIndex(e => String(e.uid) === String(op && op.uid) || (e.keys && op && op.title && e.keys[0] === op.title));
                            if (op.action === 'add_or_update') {
                                const pos = mapPositionValue(op.position);
                                if (idx > -1) {
                                    const target = entriesArr[idx];
                                    if (op.content !== undefined) target.content = op.content;
                                    if (op.depth !== undefined) target.depth = parseInt(op.depth) || target.depth;
                                    if (op.order !== undefined) target.order = parseInt(op.order) || target.order;
                                    if (pos !== null) target.position = pos;
                                    if (Array.isArray(op.keys) && op.keys.length) target.keys = op.keys;
                                } else {
                                    const newUid = Date.now() + entriesArr.length;
                                    wb.entries[newUid] = {
                                        uid: newUid,
                                        keys: Array.isArray(op.keys) && op.keys.length ? op.keys : [op.title || '新条目'],
                                        content: op.content || '',
                                        constant: false, disable: false,
                                        order: parseInt(op.order) || 100,
                                        selectiveLogic: 0, excludeRecursion: false, probability: 100,
                                        depth: parseInt(op.depth) || 4,
                                        position: pos !== null ? pos : 1,
                                        role: 0
                                    };
                                }
                                modifiedWorldbook = true;
                            } else if (op.action === 'delete') {
                                if (idx > -1) { delete wb.entries[String(entriesArr[idx].uid)]; modifiedWorldbook = true; }
                                else if (op.uid) { delete wb.entries[String(op.uid)]; modifiedWorldbook = true; }
                                else if (op.title) {
                                    const tIdx = entriesArr.findIndex(e => e.keys && e.keys[0] === op.title);
                                    if (tIdx > -1) { delete wb.entries[String(entriesArr[tIdx].uid)]; modifiedWorldbook = true; }
                                }
                            }
                        });
                    }

                    // ② 提示词规则块增删改（兼容 prompt_blocks_updates 与旧 prompt_updates）
                    const promptOps = Array.isArray(operations.prompt_blocks_updates)
                        ? operations.prompt_blocks_updates
                        : (Array.isArray(operations.prompt_updates) ? operations.prompt_updates : []);
                    if (promptOps.length > 0) {
                        const curPreset = promptPresets[currentPromptId];
                        if (curPreset) {
                            if (!Array.isArray(curPreset.blocks)) curPreset.blocks = [];
                            promptOps.forEach(op => {
                                const block = curPreset.blocks.find(b => b.name === op.name);
                                if (op.action === 'add_or_update') {
                                    if (block) {
                                        if (op.content !== undefined) block.content = op.content;
                                        if (op.role !== undefined) block.role = op.role;
                                        if (op.state !== undefined) block.enabled = op.state !== false;
                                    } else {
                                        curPreset.blocks.push({
                                            uid: Date.now() + curPreset.blocks.length,
                                            name: op.name || '新规则块',
                                            role: op.role || 'system',
                                            content: op.content || '',
                                            enabled: op.state !== false
                                        });
                                    }
                                    modifiedPrompts = true;
                                } else if (op.action === 'delete') {
                                    const bi = curPreset.blocks.findIndex(b => b.name === op.name);
                                    if (bi > -1) { curPreset.blocks.splice(bi, 1); modifiedPrompts = true; }
                                }
                            });
                        }
                    }

                    // ③ 预设全局设置更新（system_prompt / input_sequence / output_sequence）
                    if (operations.preset_settings_updates && typeof operations.preset_settings_updates === 'object' && Object.keys(operations.preset_settings_updates).length > 0) {
                        const curPreset = promptPresets[currentPromptId];
                        if (curPreset) {
                            const g = operations.preset_settings_updates;
                            ['system_prompt', 'input_sequence', 'output_sequence'].forEach(k => {
                                if (g[k] !== undefined && g[k] !== null) curPreset[k] = String(g[k]);
                            });
                            modifiedPrompts = true;
                        }
                    }

                    // ④ 驱动 UI 刷新与本地持久化
                    if (modifiedWorldbook || modifiedPrompts) {
                        hiddenApplied = true;
                        saveToLocal();
                        if (modifiedWorldbook) renderAll();
                        if (modifiedPrompts) {
                            renderDropdowns();
                            if (document.getElementById('modalTitle') && document.getElementById('modalTitle').textContent.includes('提示词管理')) {
                                showModal('提示词管理');
                            }
                        }
                        showToast('交流助手已同步修改工作区数据');
                        console.log("✅ 交流助手已成功同步数据修改！");
                    }
                }

                // 将解析结果与注入状态回填到该条消息（供「🕵️ 详情」查看）
                const detailMsg = chatMessages[chatMessages.length - 1];
                if (detailMsg && detailMsg.role === 'assistant') {
                    detailMsg._ops = (parsedData && typeof parsedData === 'object' && !Array.isArray(parsedData)) ? parsedData : null;
                    detailMsg._opsApplied = hiddenApplied;
                }

            } catch (err) {
                console.error("设定交流助手执行失败:", err);
                const lastMsg = chatMessages[chatMessages.length - 1];
                if (lastMsg && lastMsg._pending) {
                    lastMsg.content = '❌ 交流失败：' + err.message;
                    delete lastMsg._pending;
                } else {
                    chatMessages.push({ role: 'assistant', content: '❌ 交流失败：' + err.message });
                }
                renderChatMessages();
            }
        }
        // ============================================================
        //  导入提示词预设 (高兼容 SillyTavern Prompt Manager / Context Template)
        // ============================================================
        function handleImportPromptPreset() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';

            input.onchange = function (e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function (ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        let newBlocks = [];

                        // 探测 1：纯数组 / 标准 blocks 数组
                        if (Array.isArray(data)) {
                            newBlocks = data;
                        } else if (data.blocks && Array.isArray(data.blocks)) {
                            newBlocks = data.blocks;
                        }
                        // 探测 2：酒馆 Prompt Manager 预设格式 (通常包含 prompts 数组)
                        else if (data.prompts && Array.isArray(data.prompts)) {
                            newBlocks = data.prompts.map((p, index) => ({
                                name: p.name || p.identifier || `导入规则块 ${index + 1}`,
                                state: p.enabled !== false,
                                role: p.role || 'system',
                                content: p.content || p.text || p.value || ''
                            }));
                        }
                        // 探测 3：酒馆 Context Template / Instruct 扁平化格式
                        else if (data.system_prompt || data.story_string || data.system || data.user) {
                            if (data.system_prompt || data.system) {
                                newBlocks.push({ name: "系统指令 (System)", state: true, role: "system", content: data.system_prompt || data.system });
                            }
                            if (data.story_string) {
                                newBlocks.push({ name: "故事主轴 (Story String)", state: true, role: "system", content: data.story_string });
                            }
                            if (data.post_history_instructions) {
                                newBlocks.push({ name: "历史后指令 (Post-History)", state: true, role: "system", content: data.post_history_instructions });
                            }
                            if (data.user || data.user_prompt) {
                                newBlocks.push({ name: "用户越狱 (User)", state: true, role: "user", content: data.user || data.user_prompt });
                            }
                        }
                        // 探测 4：某些旧版导出格式 (data 数组)
                        else if (data.data && Array.isArray(data.data)) {
                            newBlocks = data.data;
                        }
                        // 兜底拦截
                        else {
                            throw new Error("未能识别有效的提示词结构。请确保导入的是合法的 SillyTavern JSON 预设。");
                        }

                        // 统一清洗：state → enabled，补全 uid/name/role/content，过滤空内容
                        newBlocks = newBlocks
                            .map((b, index) => ({
                                uid: Date.now() + index,
                                name: b.name || `规则区块 ${index + 1}`,
                                role: String(b.role || 'system').toLowerCase(),
                                enabled: b.state !== undefined ? b.state : (b.enabled !== undefined ? b.enabled : true),
                                content: b.content || b.text || b.prompt || b.value || ''
                            }))
                            .filter(b => b.content && b.content.trim() !== '');

                        if (newBlocks.length === 0) {
                            throw new Error("文件解析成功，但未能提取到任何有效的文本内容。");
                        }

                        // 合并到当前预设（而非新建）
                        const preset = promptPresets[currentPromptId];
                        if (preset) {
                            if (!Array.isArray(preset.blocks)) preset.blocks = [];
                            preset.blocks = preset.blocks.concat(newBlocks);
                        } else {
                            const presetId = 'prompt_' + Date.now();
                            promptPresets[presetId] = { name: '导入的预设', blocks: newBlocks };
                            currentPromptId = presetId;
                        }

                        saveToLocal();
                        renderDropdowns();
                        showToast(`✅ 导入成功！已识别 ${newBlocks.length} 个规则块并合并到当前预设。`);

                        // 动态重载模态框内容以刷新列表与块编辑器
                        if (document.getElementById('modalTitle') && document.getElementById('modalTitle').textContent.includes('提示词管理')) {
                            showModal('提示词管理');
                        }

                    } catch (err) {
                        console.error(err);
                        alert(`❌ 提示词导入失败: ${err.message}`);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // ============================================================

        function escHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        // 🚀 修复二：textarea 高度自适应（用 requestAnimationFrame 打散布局压力，防 Layout Thrashing）
        function autoResize(el) {
            if (!el) return;
            let done = false;
            const doResize = () => {
                if (done) return;
                done = true;
                el.style.height = 'auto'; // 先归零
                el.style.height = el.scrollHeight + 'px'; // 再根据实际内容撑开
            };
            // 优先利用浏览器帧渲染机制打散布局压力
            if (typeof requestAnimationFrame === 'function') {
                requestAnimationFrame(doResize);
                // 兜底：若 rAF 被节流（后台标签页/忙碌），150ms 后强制生效，保证高度最终被撑开
                setTimeout(doResize, 150);
            } else {
                doResize();
            }
        }

        // 导出指定预设为 SillyTavern 兼容 JSON

        // ============================================================
        //  容错地从 AI 返回文本中提取 JSON 数组（用于批量生成）
        // ============================================================
        function extractJsonArray(text) {
            if (!text) return null;
            // 1. 去除 Markdown 代码块标记
            let t = String(text).replace(/```json/gi, '').replace(/```/g, '').trim();
            // 2. 尝试直接解析
            try { const d = JSON.parse(t); if (Array.isArray(d)) return d; } catch (e) { /* 继续尝试提取 */ }
            // 3. 查找第一个平衡的 [ ... ] 区域（兼容前后带解释文字）
            const start = t.indexOf('[');
            if (start >= 0) {
                let depth = 0, inStr = false, esc = false;
                for (let i = start; i < t.length; i++) {
                    const c = t[i];
                    if (inStr) {
                        if (esc) esc = false;
                        else if (c === '\\') esc = true;
                        else if (c === '"') inStr = false;
                        continue;
                    }
                    if (c === '"') inStr = true;
                    else if (c === '[') depth++;
                    else if (c === ']') {
                        depth--;
                        if (depth === 0) {
                            try { const d = JSON.parse(t.slice(start, i + 1)); if (Array.isArray(d)) return d; } catch (e) { break; }
                        }
                    }
                }
            }
            return null;
        }

        // ============================================================
        //  YAML 行级状态机解析：将 YAML 风格的 worldbook_updates 转成标准对象
        //  支持 - action: / title: / keys: 列表 / content: 跨行块
        // ============================================================
        function parseYamlInstructions(text) {
            const result = { worldbook_updates: [] };
            let current = null;
            let contentLines = null; // content 跨行收集

            const parseKv = (s) => {
                const m = s.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*:\s*(.*)$/);
                if (!m) return null;
                return { key: m[1], value: m[2].trim().replace(/^["']|["']$/g, '') };
            };
            const isBlockMarker = (v) => /^[|>][+-]?\s*$/.test(v); // YAML 块标量标记 (| > |- 等)
            const flushContent = () => {
                if (current && contentLines !== null) { current.content = contentLines.join('\n').trim(); contentLines = null; }
            };
            const applyKv = (obj, key, value) => {
                if (key === 'action') obj.action = value || 'add_or_update';
                else if (key === 'title') obj.title = value;
                else if (key === 'keys') {
                    if (value === '') obj.keys = [];
                    else if (/^\[.*\]$/.test(value)) {
                        try { const arr = JSON.parse(value); if (Array.isArray(arr)) obj.keys = arr.map(String); else obj.keys = [value]; }
                        catch (e) { obj.keys = [value]; }
                    } else {
                        obj.keys = value.split(',').map(s => s.trim()).filter(Boolean);
                    }
                } else if (key === 'content') obj.content = value;
                else obj[key] = value;
            };

            const lines = String(text).split(/\r?\n/);
            for (const raw of lines) {
                const trimmed = raw.trim();
                if (!trimmed || trimmed === '---' || trimmed.startsWith('#')) continue;
                if (/^worldbook_updates\s*:/.test(trimmed)) continue;

                if (trimmed.startsWith('- ')) {
                    const rest = trimmed.slice(2).trim();
                    const kv = parseKv(rest);
                    if (kv) {
                        // 新条目行：- action: ... / - title: ...
                        flushContent();
                        current = { action: 'add_or_update' };
                        result.worldbook_updates.push(current);
                        if (kv.key === 'content') {
                            if (isBlockMarker(kv.value)) { contentLines = []; current.content = ''; }
                            else { contentLines = kv.value ? [kv.value] : []; current.content = kv.value; }
                        }
                        else applyKv(current, kv.key, kv.value);
                    } else {
                        // keys 列表项：- 触发词
                        if (current) { if (!Array.isArray(current.keys)) current.keys = []; if (rest) current.keys.push(rest); }
                    }
                    continue;
                }

                const kv = parseKv(trimmed);
                if (kv) {
                    if (!current) { current = { action: 'add_or_update' }; result.worldbook_updates.push(current); }
                    if (kv.key === 'content') {
                        if (isBlockMarker(kv.value)) { contentLines = []; current.content = ''; }
                        else { contentLines = kv.value !== '' ? [kv.value] : []; current.content = kv.value !== '' ? kv.value : ''; }
                    } else {
                        applyKv(current, kv.key, kv.value);
                    }
                    continue;
                }

                // content 的跨行延续（缩进的正文行）
                if (current && contentLines !== null) {
                    contentLines.push(trimmed);
                    current.content = contentLines.join('\n');
                }
            }
            flushContent();
            return result;
        }

        // ============================================================
        //  触发扫描预览：模拟世界书扫描，返回命中条目及关键词
        // ============================================================
        function simulateScan(text) {
            const t = String(text || '').toLowerCase();
            const scanDepth = (getCurrentWorldbook() && getCurrentWorldbook().scan_depth) || 4;
            const hits = [];
            getEntriesArray().forEach(e => {
                if (e.disable) return;
                const keys = Array.isArray(e.keys) ? e.keys.filter(k => k) : [];
                const matched = keys.filter(k => t.includes(String(k).toLowerCase()));
                let hit = false;
                if (e.constant) { hit = true; }                              // 常驻：总是触发
                else if (e.selectiveLogic === 3) { hit = keys.length > 0 && matched.length === keys.length; } // AND_ALL
                else if (e.selectiveLogic === 1) { hit = matched.length > 0 && matched.length < keys.length; }   // NOT_ALL: 至少命中1个但非全中才触发，杜绝零匹配全量爆破
                else if (e.selectiveLogic === 2) { hit = matched.length === 0; }                             // NOT_ANY
                else { hit = matched.length > 0; }                                                          // AND_ANY (0)
                // 深度过滤：非常驻条目深度超过扫描深度时不触发
                const depthOk = e.constant || (typeof e.depth === 'number' ? e.depth <= scanDepth : true);
                if (hit && depthOk) hits.push({ entry: e, matched, scanDepth });
            });
            hits.sort((a, b) => a.entry.order - b.entry.order);
            return hits;
        }

                    <div id="modelListContainer" style="display: none; max-height: 160px; overflow-y: auto; margin-top: 8px; padding: 8px; background: var(--bg-tertiary); border-radius: 6px; border: 1px solid var(--border-color);">

                    const confirmBtn = document.getElementById('modalConfirmBtn');
                    const originalText = confirmBtn.textContent;
                    confirmBtn.textContent = '处理中...'; confirmBtn.disabled = true;

                    // 呼叫 AI，传入的 extraContext 是用户的修改指令
                    const result = await fetchAICompletion('自定义编辑', instruction);

                    if (result && entry) {
                        updateEntryField('content', result);
                        showToast('AI 自定义编辑完成！');
                        closeModal();
                    }

                    confirmBtn.textContent = originalText; confirmBtn.disabled = false;
                };

            } else if (title.includes('生成') || title.includes('扩写') || title.includes('润色')) {
                bodyHTML = `<textarea id="aiInputTextarea" placeholder="输入要求或待处理文本...">${entry && !title.includes('生成') ? entry.content : ''}</textarea>`;
                modalConfirmCallback = async function () {
                    const inputText = document.getElementById('aiInputTextarea').value;
                    const actionType = title.includes('扩写') ? '扩写' : title.includes('润色') ? '润色' : '生成';
                    const confirmBtn = document.getElementById('modalConfirmBtn');
                    const originalText = confirmBtn.textContent;
                    confirmBtn.textContent = '处理中...'; confirmBtn.disabled = true;
                    const result = await fetchAICompletion(actionType, inputText);
                    if (result && entry) { updateEntryField('content', result); showToast('处理完成！'); closeModal(); }
                    confirmBtn.textContent = originalText; confirmBtn.disabled = false;
                };
            } else if (title.includes('新建世界书')) {
                bodyHTML = `<input placeholder="名称" id="newWbName" /><textarea placeholder="描述" id="newWbDesc" rows="2"></textarea>`;
                modalConfirmCallback = function () {
                    worldbooks.push({ uid: Date.now(), name: document.getElementById('newWbName')?.value || '未命名', description: document.getElementById('newWbDesc')?.value || '', scan_depth: 4, token_budget: 2048, recursive_scanning: true, entries: {} });
                    currentWorldbookUid = worldbooks[worldbooks.length - 1].uid; currentEntryUid = null;
                    saveToLocal(); renderAll(); showToast('已创建'); closeModal();
                };
            } else if (title.includes('重命名世界书')) {
                const wbUid = extra;
                const wb = worldbooks.find(w => w.uid === wbUid);
                bodyHTML = `<input value="${escHtml(wb ? wb.name : '')}" id="renameInput" />`;
                modalConfirmCallback = function () {
                    const val = document.getElementById('renameInput')?.value.trim();
                    if (val && wb) {
                        wb.name = val;
                        saveToLocal();
                        renderWorldbooks();
                        showToast('世界书已重命名');
                    }
                    closeModal();
                };
            } else if (title.includes('重命名工作台')) {
                bodyHTML = `<input value="我的奇幻世界" id="renameInput" />`;
                modalConfirmCallback = function () {
                    const val = document.getElementById('renameInput')?.value;
                    if (val) { document.getElementById('workspaceName').textContent = val; showToast('已重命名'); }
                    closeModal();
                };
            }

            document.getElementById('modalBody').innerHTML = bodyHTML;
            if (title.includes('提示词管理')) { initBlockEditor(); renderBlockEditor(); }
            document.getElementById('modalOverlay').classList.add('show');
            const confirmBtn = document.getElementById('modalConfirmBtn');

            if (title.includes('触发预览')) {
                confirmBtn.textContent = '开始扫描';
            } else if (!title.includes('审查') && !title.includes('智能调优') && !title.includes('生成') && !title.includes('扩写') && !title.includes('润色') && !title.includes('批量')) {
                confirmBtn.textContent = '确认';
            } else if (title.includes('审查') || title.includes('智能调优')) {
                confirmBtn.textContent = '开始分析';
            }

            confirmBtn.onclick = function () { if (modalConfirmCallback) { modalConfirmCallback(); } else { closeModal(); } };
            if (title.includes('日志')) { confirmBtn.textContent = '关闭'; confirmBtn.onclick = function () { closeModal(); }; }
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); modalConfirmCallback = null; }
        function handleModalConfirm() { }

        // ============================================================
        //  🕵️ 查看完整 AI 回复 & 隐藏对话信息
        // ============================================================
        // 切换详情模态框的标签页
        function switchChatDetailTab(tab) {
            ['raw', 'hidden', 'ops'].forEach(t => {
                const panel = document.getElementById('detailPanel_' + t);
                const btn = document.getElementById('detailTab_' + t);
                if (panel) panel.style.display = (t === tab) ? 'block' : 'none';
                if (btn) btn.classList.toggle('active', t === tab);
            });
        }

        // 打开最近一条 AI 回复的详情（次级工具栏「🕵️ 详情」按钮）
        function viewLastChatDetails() {
            for (let i = chatMessages.length - 1; i >= 0; i--) {
                if (chatMessages[i].role !== 'user') { viewChatDetails(i); return; }
            }
            showToast('暂无 AI 回复可供查看');
        }

        // 打开指定消息的详情模态框（完整回复 / 隐藏信息 / 提取操作 三个标签页）
        function viewChatDetails(idx) {
            const msg = chatMessages[idx];
            if (!msg) return;

            const isAssistant = msg.role !== 'user';
            const hasRaw = isAssistant && !!msg._raw;
            const hasOps = isAssistant && !!msg._ops;

            // 标签 1：完整原始回复
            let rawHTML;
            if (hasRaw) {
                rawHTML = `
                    <div class="detail-note">以下为本次请求收到后<b>未清洗</b>的完整原始回复。其中 <code>&lt;think&gt;</code> 思考块、<code>[metacognition]</code> 与 JSON/YAML 操作代码块在聊天区中被隐藏，仅在此完整展示。</div>
                    <pre class="detail-pre">${escHtml(msg._raw)}</pre>`;
            } else {
                rawHTML = `<div class="text-muted">该消息未保留原始回复（可能是旧数据或清洗结果为空）。</div>`;
            }

            // 标签 2：隐藏对话信息
            let hiddenHTML;
            if (isAssistant) {
                hiddenHTML = `
                    <div class="detail-note">以下为本次请求中<b>发送给 AI 的隐藏上下文</b>与后台处理信息，均不会显示在聊天区。</div>
                    <div class="detail-section-title">📊 请求概况</div>
                    <div class="detail-kv"><span class="detail-k">模式</span><span class="detail-v">${msg._mode === '只读' ? '🔒 只读（不注入）' : '🔓 读写（可注入）'}</span></div>
                    ${msg._historyCount !== undefined ? `<div class="detail-kv"><span class="detail-k">历史消息</span><span class="detail-v">发送 ${msg._historyCount} 条（近因滑动窗口）</span></div>` : ''}
                    ${msg._injectedCount !== undefined ? `<div class="detail-kv"><span class="detail-k">注入设定</span><span class="detail-v">${msg._injectedCount} 个（动态扫描 + 聚焦条目）</span></div>` : ''}
                    ${msg._injectedTitles && msg._injectedTitles.length ? `<div class="detail-kv"><span class="detail-k">注入清单</span><span class="detail-v">${escHtml(msg._injectedTitles.join('、'))}</span></div>` : ''}
                    ${msg._opsApplied !== undefined ? `<div class="detail-kv"><span class="detail-k">数据修改</span><span class="detail-v">${msg._opsApplied ? '✅ 已静默应用到工作台' : '— 未执行任何修改'}</span></div>` : ''}
                    ${msg._meta ? `<div class="detail-section-title">🧾 隐藏元指令（追加在最后一条用户消息末尾）</div><pre class="detail-pre">${escHtml(msg._meta)}</pre>` : ''}
                    ${msg._system ? `<div class="detail-section-title">📦 系统提示词（本次请求实际发送）</div><pre class="detail-pre">${escHtml(msg._system)}</pre>` : ''}
                `;
            } else {
                hiddenHTML = `<div class="text-muted">用户消息不包含隐藏信息。</div>`;
            }

            // 标签 3：提取的操作指令
            let opsHTML;
            if (hasOps) {
                opsHTML = `
                    <div class="detail-note">AI 回复末尾附带的<b>静默操作指令</b>（JSON / YAML 双引擎提取），已从聊天区剥离并按需注入工作台。</div>
                    <div class="detail-kv"><span class="detail-k">应用状态</span><span class="detail-v">${msg._opsApplied ? '✅ 已应用到工作台' : '⚠️ 已提取但未触发修改'}</span></div>
                    <pre class="detail-pre">${escHtml(JSON.stringify(msg._ops, null, 2))}</pre>`;
            } else {
                opsHTML = `<div class="text-muted">未从该回复中提取到任何操作指令（只读模式或 AI 未输出 JSON）。</div>`;
            }

            document.getElementById('modalTitle').textContent = isAssistant ? '🕵️ 对话详情 · AI 回复' : '🕵️ 对话详情 · 用户消息';
            document.getElementById('modalBody').innerHTML = `
                <div class="detail-tabs">
                    <button id="detailTab_raw" class="detail-tab" onclick="switchChatDetailTab('raw')">🧾 完整回复</button>
                    <button id="detailTab_hidden" class="detail-tab" onclick="switchChatDetailTab('hidden')">🕵️ 隐藏信息</button>
                    <button id="detailTab_ops" class="detail-tab" onclick="switchChatDetailTab('ops')">⚙️ 提取操作</button>
                </div>
                <div id="detailPanel_raw" class="detail-panel" style="display:block;">${rawHTML}</div>
                <div id="detailPanel_hidden" class="detail-panel" style="display:none;">${hiddenHTML}</div>
                <div id="detailPanel_ops" class="detail-panel" style="display:none;">${opsHTML}</div>
            `;
            document.getElementById('modalConfirmBtn').textContent = '关闭';
            document.getElementById('modalConfirmBtn').onclick = function () { closeModal(); };
            document.getElementById('modalOverlay').classList.add('show');
            switchChatDetailTab('raw');
        }

        function showToast(msg) {
            // 🚀 核心修复：在弹出新提示前，先销毁页面上已有的残留提示框，防止文字重叠（糊字）
            document.querySelectorAll('.toast-msg').forEach(el => el.remove());
            const div = document.createElement('div');
            div.className = 'toast-msg'; // 赋予类名方便后续选中
            div.textContent = msg;
            div.style.cssText = `position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-surface); color: var(--text-primary); padding: 10px 24px; border-radius: 8px; border: 1px solid var(--accent); z-index: 9999; font-size: 14px; box-shadow: var(--shadow); animation: fadeIn 0.2s ease-out;`;
            document.body.appendChild(div);
            setTimeout(() => { if (div.parentNode) div.remove(); }, 2500);
        }

        // 快捷键绑定
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 's') { e.preventDefault(); handleSaveWorkspace(); }
            if (e.ctrlKey && e.key === 'n') { e.preventDefault(); showModal('新建条目'); }
            // Ctrl+Enter 发送聊天由 handleChatKeyDown 处理（textarea 内）
        });

    </script>

    <!-- 🚀 星图：全屏知识图谱画布（ECharts 力导向图） -->
    <div id="graphModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-base); z-index: 3000;">
        <div style="position: absolute; top: 20px; right: 30px; z-index: 3010; display: flex; gap: 15px; align-items: center;">
            <span style="color: var(--text-secondary); font-size: 14px;">💡 提示：鼠标滚轮缩放，拖拽画布平移，点击节点可直接跳转编辑</span>
            <button class="btn" onclick="closeGraph()" style="background: var(--bg-elevated); color: var(--red); border: 1px solid var(--red);">❌ 关闭星图</button>
        </div>
        <div id="graphContainer" style="width: 100%; height: 100%;"></div>
    </div>
</body>

</html>
