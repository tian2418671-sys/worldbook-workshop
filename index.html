        // ============================================================
        //  预设语法特征检测 + 酒馆宏渲染 + 自适应全局请求构建引擎
        // ============================================================
        /**
         * 预设语法与格式特征提取器
         * 自动识别 Handlebars 模板标记、W++ 伪代码、XML 结构、Markdown 排版等特征，
         * 并为后续 AI 请求生成格式约束指导（styleGuide）。
         */
        function detectPresetSyntax(presetBlocks) {
            if (!presetBlocks || !Array.isArray(presetBlocks)) return { styleGuide: "", syntaxType: "standard" };

            const fullText = presetBlocks.map(b => b.content || '').join('\n');
            const features = [];

            // 1. 检查 Handlebars / 逻辑条件宏
            if (/\{\{#if[\s\S]*?\}\}/i.test(fullText) || /\{\{#[a-z]+[\s\S]*?\}\}/i.test(fullText)) {
                features.push("使用了 Handlebars 逻辑条件语句（如 {{#if ...}}）");
            }

            // 2. 检查 W++ 规则语法 (例如: [Character("Name"){ Mind("Trait") }])
            if (/\[\s*\w+\s*\([^)]*\)\s*\{[\s\S]*?\}\s*\]/i.test(fullText) || /[\w\s]+\s*::\s*[\w\s]+/i.test(fullText)) {
                features.push("使用了 W++ / 结构化伪代码格式定义属性");
            }

            // 3. 检查 XML 规则标签 (例如: <system_instructions>...</system_instructions>)
            if (/<([a-zA-Z0-9_]+)>[\s\S]*?<\/\1>/.test(fullText)) {
                features.push("使用了 XML 标签包裹排版规则");
            }

            // 4. 检查 Markdown 强调排版 (例如: "对话", *动作*)
            if (/"[^"]+"\s*,\s*\*[^*]+\*/.test(fullText) || /\*[^*]+\*\s*"[^"]+"/.test(fullText)) {
                features.push("排版规范：对话使用双引号，动作与心理描写使用单/双星号包裹");
            }

            let styleGuide = "";
            if (features.length > 0) {
                styleGuide = `\n\n【预设格式与语法规范】\n当前预设包含以下排版/语法特征，请在生成内容或修改世界书条目时严格对齐此格式：\n- ` + features.join("\n- ");
            }

            return {
                features: features,
                styleGuide: styleGuide,
                hasHandlebars: features.some(f => f.includes("Handlebars")),
                hasWPlusPlus: features.some(f => f.includes("W++"))
            };
        }

        /**
         * 轻量级 Handlebars 与酒馆 Macro 自适应渲染器
         * 对模板变量（如 {{user}}、{{char}}、{{#if ...}} 等）进行实时替换，避免保留裸代码导致 AI 误解。
         */
        function parseSillyTavernMacros(text, contextData = {}) {
            if (!text || typeof text !== 'string') return '';

            const { char = 'AI', user = 'User', scenario = '', personality = '', worldbookContext = '' } = contextData;

            let result = text;

            // 1. 简易处理 Handlebars {{#if key}} ... {{/if}} 语法（支持可选的 {{else}} 分支）
            result = result.replace(/\{\{#if\s+([a-zA-Z0-9_]+)\}\}([\s\S]*?)(?:\{\{else\}\}([\s\S]*?))?\{\{\/if\}\}/g, (match, p1, p2, p3) => {
                const keyVal = contextData[p1];
                const isTrue = keyVal && keyVal.toString().trim() !== '' && keyVal !== false;
                if (isTrue) {
                    return p2;
                } else {
                    return p3 || '';
                }
            });

            // 2. 替换常规酒馆宏
            const macroMap = {
                '{{char}}': char,
                '{{user}}': user,
                '{{scenario}}': scenario,
                '{{personality}}': personality,
                '{{worldbook}}': worldbookContext,
                '{{lore}}': worldbookContext,
                '{{trim}}': ''
            };

            Object.keys(macroMap).forEach(macro => {
                const reg = new RegExp(macro.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
                result = result.replace(reg, macroMap[macro]);
            });

            return result;
        }

        /**
         * 组装带有“自适应格式学习”功能的 API 请求消息
         * 在发送前自动注入检测到的格式与风格指南，确保大模型获得学习能力。
         */
        function assembleAdaptivePromptMessages(blocks, userMessage = '', worldbookContext = '', extraContextData = {}) {
            if (!blocks || !Array.isArray(blocks)) return [];

            // 1. 扫描当前预设的语法与风格特征
            const activeBlocks = blocks.filter(b => b.enabled).sort((a, b) => (a.order || 0) - (b.order || 0));
            const syntaxAnalysis = detectPresetSyntax(activeBlocks);

            let assembledMessages = [];
            let systemContentBuffer = [];

            activeBlocks.forEach(block => {
                // 自动清洗与宏渲染
                let renderedContent = parseSillyTavernMacros(block.content || '', {
                    worldbookContext: worldbookContext,
                    ...extraContextData
                });

                if (block.role === 'system') {
                    systemContentBuffer.push(renderedContent);
                } else {
                    if (systemContentBuffer.length > 0) {
                        assembledMessages.push({ role: 'system', content: systemContentBuffer.join('\n\n') });
                        systemContentBuffer = [];
                    }
                    assembledMessages.push({ role: block.role, content: renderedContent });
                }
            });

            // 2. 将“语法与格式指引”注入到最顶部的 System 缓冲区中
            if (syntaxAnalysis.styleGuide) {
                systemContentBuffer.push(syntaxAnalysis.styleGuide);
            }

            if (systemContentBuffer.length > 0) {
                assembledMessages.push({ role: 'system', content: systemContentBuffer.join('\n\n') });
            }

            // 3. 拼接对话消息
            if (userMessage) {
                assembledMessages.push({ role: 'user', content: userMessage });
            }

            return assembledMessages;
        }

        // ============================================================
        //  自定义格式学习引擎 + 管理面板 + 请求注入
        // ============================================================
        /**
         * 格式学习引擎：从用户示范文本中分析并提取排版与语法规则
         */
        function learnCustomFormat(sampleText) {
            if (!sampleText || typeof sampleText !== 'string' || !sampleText.trim()) {
                return null;
            }

            const text = sampleText.trim();
            const learnedRules = {
                sample: text,
                features: [],
                brackets: [],
                syntaxType: 'Custom/Mixed',
                templateSkeleton: ''
            };

            // 1. 提取符号包裹特征 (例如："对话", *动作*, <设定>, [属性])
            const bracketPatterns = [
                { type: '引号/对话', reg: /"([^"]+)"/g, example: '"内容"' },
                { type: '星号/动作或强调', reg: /\*([^*]+)\*/g, example: '*内容*' },
                { type: '尖括号/标签', reg: /<([^>]+)>/g, example: '<内容>' },
                { type: '方括号/属性', reg: /\[([^\]]+)\]/g, example: '[内容]' },
                { type: '花括号/宏或变量', reg: /\{([^}]+)\}/g, example: '{内容}' }
            ];

            bracketPatterns.forEach(p => {
                if (p.reg.test(text)) {
                    learnedRules.brackets.push(p.type);
                    learnedRules.features.push(`特殊符号规范：使用 ${p.example} 来封装特定类型字段。`);
                }
            });

            // 2. 检测结构类型 (W++, YAML, XML, 伪代码, 列表结构)
            if (/\[\s*\w+\s*\([^)]*\)\s*\{[\s\S]*?\}\s*\]/i.test(text)) {
                learnedRules.syntaxType = 'W++ / 经典角色卡结构';
                learnedRules.features.push('使用 W++ 伪代码格式结构（如 [Type("Name"){ Key("Value") }]）。');
            } else if (/^[a-zA-Z0-9_]+\s*:\s*.+/m.test(text)) {
                learnedRules.syntaxType = 'Key-Value / YAML 风格';
                learnedRules.features.push('使用冒号键值对（Key: Value）形式罗列属性。');
            } else if (/<([a-zA-Z0-9_]+)>[\s\S]*?<\/\1>/.test(text)) {
                learnedRules.syntaxType = 'XML 标签封装';
                learnedRules.features.push('使用 XML 节点标签（如 <tag>...</tag>）划分段落。');
            }

            // 3. 提取模版骨架 (替换具体值为占位符)
            learnedRules.templateSkeleton = text
                .replace(/"[^"]+"/g, '"[具体内容]"')
                .replace(/\*[^*]+\*/g, '*[动作或强调]*')
                .replace(/(?<=:\s*)[^\n]+/g, '[属性值]');

            return learnedRules;
        }

        // ============================================================
        //  全局知识数据库（静态挂载参考模块，平行于世界书）
        // ============================================================

        /**
         * 解析上传的世界书文件，并将其转换为静态数据库条目（完美修复名称异常版）
         * 兼容：酒馆标准导出（entries 为 { uid: {...} } 对象）、纯数组、以及 data.entries 数组
         */
        async function importToDatabase(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            // 提取去后缀的文件名作为该批次知识库的“来源名称”
            const sourceName = file.name.replace(/\.[^/.]+$/, "");

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    let entries = data.entries || data;

                    // 兼容酒馆格式：entries 可能为 { uid: {...} } 对象（用 Object.values 展开）
                    if (entries && typeof entries === 'object' && !Array.isArray(entries)) {
                        entries = Object.values(entries);
                    }

                    if (!Array.isArray(entries)) {
                        throw new Error("格式不兼容：未找到有效的世界书条目数组。");
                    }

                    let importCount = 0;
                    entries.forEach((entry) => {
                        if (!entry || typeof entry !== 'object') return;
                        const content = entry.content || entry.text || '';

                        if (content.trim() !== '') {
                            // 🧠 1. 智能且绝对安全的名称萃取引擎 (多重兜底，杜绝空数组 truthy 陷阱)
                            let rawName = entry.name || entry.title || entry.comment || entry.label || entry.displayName;

                            if (!rawName) {
                                // 严谨校验 keys / key (兼容数组与字符串，空数组直接跳过)
                                if (Array.isArray(entry.keys) && entry.keys.length > 0) {
                                    rawName = entry.keys.filter(k => k && String(k).trim()).join(', ');
                                } else if (typeof entry.keys === 'string' && entry.keys.trim()) {
                                    rawName = entry.keys;
                                } else if (Array.isArray(entry.key) && entry.key.length > 0) {
                                    rawName = entry.key.filter(k => k && String(k).trim()).join(', ');
                                } else if (typeof entry.key === 'string' && entry.key.trim()) {
                                    rawName = entry.key;
                                }
                            }

                            // 🧠 2. 若依然无有效名称，截取内容前15字或序号，绝不返回 undefined
                            let finalName = '';
                            if (rawName && String(rawName).trim()) {
                                finalName = String(rawName).trim();
                            } else if (content.trim()) {
                                const cleanContent = content.trim().replace(/[\r\n\t]+/g, ' ');
                                finalName = cleanContent.length > 15 ? cleanContent.substring(0, 15) + '...' : cleanContent;
                            } else {
                                finalName = `未命名资料 #${knowledgeDatabase.length + importCount + 1}`;
                            }

                            knowledgeDatabase.push({
                                id: 'db_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                                name: finalName,
                                content: content,
                                source: sourceName,
                                enabled: false // 默认不开启，由用户手动决定
                            });
                            importCount++;
                        }
                    });

                    saveToLocal();
                    showToast(`✅ 成功向数据库注入 ${importCount} 条资料，来源：[${sourceName}]`);

                    // 重新渲染面板
                    showDatabaseModal();

                } catch (err) {
                    showToast('❌ 导入失败: ' + err.message);
                }
                inputElement.value = ''; // 清空 input
            };
            reader.readAsText(file);
        }

        // ============================================================
        //  容错地从 AI 返回文本中提取 JSON 数组（用于批量生成）
        // ============================================================
        function extractJsonArray(text) {
            if (!text) return null;
            // 1. 去除 Markdown 代码块标记
            let t = String(text).replace(/```json/gi, '').replace(/```/g, '').trim();
            // 2. 尝试直接解析
            try { const d = JSON.parse(t); if (Array.isArray(d)) return d; } catch (e) { /* 继续尝试提取 */ }
            // 3. 查找第一个平衡的 [ ... ] 区域（兼容前后带解释文字）
            const start = t.indexOf('[');
            if (start >= 0) {
                let depth = 0, inStr = false, esc = false;
                for (let i = start; i < t.length; i++) {
                    const c = t[i];
                    if (inStr) {
                        if (esc) esc = false;
                        else if (c === '\\') esc = true;
                        else if (c === '"') inStr = false;
                        continue;
                    }
                    if (c === '"') inStr = true;
                    else if (c === '[') depth++;
                    else if (c === ']') {
                        depth--;
                        if (depth === 0) {
                            try { const d = JSON.parse(t.slice(start, i + 1)); if (Array.isArray(d)) return d; } catch (e) { break; }
                        }
                    }
                }
            }
            return null;
        }

        // ============================================================
        //  YAML 行级状态机解析：将 YAML 风格的 worldbook_updates 转成标准对象
        //  支持 - action: / title: / keys: 列表 / content: 跨行块
        // ============================================================
        function parseYamlInstructions(text) {
            const result = { worldbook_updates: [] };
            let current = null;
            let contentLines = null; // content 跨行收集

            const parseKv = (s) => {
                const m = s.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*:\s*(.*)$/);
                if (!m) return null;
                return { key: m[1], value: m[2].trim().replace(/^["']|["']$/g, '') };
            };
            const isBlockMarker = (v) => /^[|>][+-]?\s*$/.test(v); // YAML 块标量标记 (| > |- 等)
            const flushContent = () => {
                if (current && contentLines !== null) { current.content = contentLines.join('\n').trim(); contentLines = null; }
            };
            const applyKv = (obj, key, value) => {
                if (key === 'action') obj.action = value || 'add_or_update';
                else if (key === 'title') obj.title = value;
                else if (key === 'keys') {
                    if (value === '') obj.keys = [];
                    else if (/^\[.*\]$/.test(value)) {
                        try { const arr = JSON.parse(value); if (Array.isArray(arr)) obj.keys = arr.map(String); else obj.keys = [value]; }
                        catch (e) { obj.keys = [value]; }
                    } else {
                        obj.keys = value.split(',').map(s => s.trim()).filter(Boolean);
                    }
                } else if (key === 'content') obj.content = value;
                else obj[key] = value;
            };

            const lines = String(text).split(/\r?\n/);
            for (const raw of lines) {
                const trimmed = raw.trim();
                if (!trimmed || trimmed === '---' || trimmed.startsWith('#')) continue;
                if (/^worldbook_updates\s*:/.test(trimmed)) continue;

                if (trimmed.startsWith('- ')) {
                    const rest = trimmed.slice(2).trim();
                    const kv = parseKv(rest);
                    if (kv) {
                        // 新条目行：- action: ... / - title: ...
                        flushContent();
                        current = { action: 'add_or_update' };
                        result.worldbook_updates.push(current);
                        if (kv.key === 'content') {
                            if (isBlockMarker(kv.value)) { contentLines = []; current.content = ''; }
                            else { contentLines = kv.value ? [kv.value] : []; current.content = kv.value; }
                        }
                        else applyKv(current, kv.key, kv.value);
                    } else {
                        // keys 列表项：- 触发词
                        if (current) { if (!Array.isArray(current.keys)) current.keys = []; if (rest) current.keys.push(rest); }
                    }
                    continue;
                }

                const kv = parseKv(trimmed);
                if (kv) {
                    if (!current) { current = { action: 'add_or_update' }; result.worldbook_updates.push(current); }
                    if (kv.key === 'content') {
                        if (isBlockMarker(kv.value)) { contentLines = []; current.content = ''; }
                        else { contentLines = kv.value !== '' ? [kv.value] : []; current.content = kv.value !== '' ? kv.value : ''; }
                    } else {
                        applyKv(current, kv.key, kv.value);
                    }
                    continue;
                }

                // content 的跨行延续（缩进的正文行）
                if (current && contentLines !== null) {
                    contentLines.push(trimmed);
                    current.content = contentLines.join('\n');
                }
            }
            flushContent();
            return result;
        }

        // ============================================================
        //  触发扫描预览：模拟世界书扫描，返回命中条目及关键词
        // ============================================================
        function simulateScan(text) {
            const t = String(text || '').toLowerCase();
            const scanDepth = (getCurrentWorldbook() && getCurrentWorldbook().scan_depth) || 4;
            const hits = [];
            getEntriesArray().forEach(e => {
                if (e.disable) return;
                const keys = Array.isArray(e.keys) ? e.keys.filter(k => k) : [];
                const matched = keys.filter(k => t.includes(String(k).toLowerCase()));
                let hit = false;
                if (e.constant) { hit = true; }                              // 常驻：总是触发
                else if (e.selectiveLogic === 3) { hit = keys.length > 0 && matched.length === keys.length; } // AND_ALL
                else if (e.selectiveLogic === 1) { hit = matched.length > 0 && matched.length < keys.length; }   // NOT_ALL: 至少命中1个但非全中才触发，杜绝零匹配全量爆破
                else if (e.selectiveLogic === 2) { hit = matched.length === 0; }                             // NOT_ANY
                else { hit = matched.length > 0; }                                                          // AND_ANY (0)
                // 深度过滤：非常驻条目深度超过扫描深度时不触发
                const depthOk = e.constant || (typeof e.depth === 'number' ? e.depth <= scanDepth : true);
                if (hit && depthOk) hits.push({ entry: e, matched, scanDepth });
            });
            hits.sort((a, b) => a.entry.order - b.entry.order);
            return hits;
        }

                modalConfirmCallback = async function () {
                    const inputText = document.getElementById('aiInputTextarea').value;
                    const actionType = title.includes('扩写') ? '扩写' : title.includes('润色') ? '润色' : '生成';
                    const confirmBtn = document.getElementById('modalConfirmBtn');
                    const originalText = confirmBtn.textContent;
                    confirmBtn.textContent = '处理中...'; confirmBtn.disabled = true;
                    const result = await fetchAICompletion(actionType, inputText);
                    if (result && entry) { updateEntryField('content', result); showToast('处理完成！'); closeModal(); }
                    confirmBtn.textContent = originalText; confirmBtn.disabled = false;
                };
            } else if (title.includes('新建世界书')) {
                bodyHTML = `<input placeholder="名称" id="newWbName" /><textarea placeholder="描述" id="newWbDesc" rows="2"></textarea>`;
                modalConfirmCallback = function () {
                    worldbooks.push({ uid: Date.now(), name: document.getElementById('newWbName')?.value || '未命名', description: document.getElementById('newWbDesc')?.value || '', scan_depth: 4, token_budget: 2048, recursive_scanning: true, entries: {} });
                    currentWorldbookUid = worldbooks[worldbooks.length - 1].uid; currentEntryUid = null;
                    saveToLocal(); renderAll(); showToast('已创建'); closeModal();
                };
            } else if (title.includes('重命名世界书')) {
                const wbUid = extra;
                const wb = worldbooks.find(w => w.uid === wbUid);
                bodyHTML = `<input value="${escHtml(wb ? wb.name : '')}" id="renameInput" />`;
                modalConfirmCallback = function () {
                    const val = document.getElementById('renameInput')?.value.trim();
                    if (val && wb) {
                        wb.name = val;
                        saveToLocal();
                        renderWorldbooks();
                        showToast('世界书已重命名');
                    }
                    closeModal();
                };
            } else if (title.includes('重命名工作台')) {
                bodyHTML = `<input value="我的奇幻世界" id="renameInput" />`;
                modalConfirmCallback = function () {
                    const val = document.getElementById('renameInput')?.value;
                    if (val) { document.getElementById('workspaceName').textContent = val; showToast('已重命名'); }
                    closeModal();
                };
            }

            document.getElementById('modalBody').innerHTML = bodyHTML;
            if (title.includes('提示词管理')) { renderPresetManager(); }
            document.getElementById('modalOverlay').classList.add('show');
            const confirmBtn = document.getElementById('modalConfirmBtn');

            if (title.includes('触发预览')) {
                confirmBtn.textContent = '开始扫描';
            } else if (!title.includes('审查') && !title.includes('智能调优') && !title.includes('生成') && !title.includes('扩写') && !title.includes('润色') && !title.includes('批量')) {
                confirmBtn.textContent = '确认';
            } else if (title.includes('审查') || title.includes('智能调优')) {
                confirmBtn.textContent = '开始分析';
            }

            confirmBtn.onclick = function () { if (modalConfirmCallback) { modalConfirmCallback(); } else { closeModal(); } };
            if (title.includes('日志')) { confirmBtn.textContent = '关闭'; confirmBtn.onclick = function () { closeModal(); }; }
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); modalConfirmCallback = null; }
        function handleModalConfirm() { }

        // ============================================================
        //  🕵️ 查看完整 AI 回复 & 隐藏对话信息
        // ============================================================
        // 切换详情模态框的标签页
        function switchChatDetailTab(tab) {
            ['raw', 'hidden', 'ops'].forEach(t => {
                const panel = document.getElementById('detailPanel_' + t);
                const btn = document.getElementById('detailTab_' + t);
                if (panel) panel.style.display = (t === tab) ? 'block' : 'none';
                if (btn) btn.classList.toggle('active', t === tab);
            });
        }

        // 打开最近一条 AI 回复的详情（次级工具栏「🕵️ 详情」按钮）
        function viewLastChatDetails() {
            for (let i = chatMessages.length - 1; i >= 0; i--) {
                if (chatMessages[i].role !== 'user') { viewChatDetails(i); return; }
            }
            showToast('暂无 AI 回复可供查看');
        }

        // 打开指定消息的详情模态框（完整回复 / 隐藏信息 / 提取操作 三个标签页）
        function viewChatDetails(idx) {
            const msg = chatMessages[idx];
            if (!msg) return;

            const isAssistant = msg.role !== 'user';
            const hasRaw = isAssistant && !!msg._raw;
            const hasOps = isAssistant && !!msg._ops;

            // 标签 1：完整原始回复
            let rawHTML;
            if (hasRaw) {
                rawHTML = `
                    <div class="detail-note">以下为本次请求收到后<b>未清洗</b>的完整原始回复。其中 <code>&lt;think&gt;</code> 思考块、<code>[metacognition]</code> 与 JSON/YAML 操作代码块在聊天区中被隐藏，仅在此完整展示。</div>
                    <pre class="detail-pre">${escHtml(msg._raw)}</pre>`;
            } else if (isAssistant && msg.content) {
                // 🆕 兼容旧数据：未保留 _raw 但有 content 时，回退展示聊天区已显示内容，避免"有数据却显示无"
                rawHTML = `
                    <div class="detail-note">该消息未保留<b>未清洗</b>的原始回复（可能是旧数据），以下为聊天区已展示的完整内容。</div>
                    <pre class="detail-pre">${escHtml(msg.content)}</pre>`;
            } else {
                rawHTML = `<div class="text-muted">该消息未保留原始回复（可能是旧数据或清洗结果为空）。</div>`;
            }

            // 标签 2：隐藏对话信息
            let hiddenHTML;
            if (isAssistant) {
                hiddenHTML = `
                    <div class="detail-note">以下为本次请求中<b>发送给 AI 的隐藏上下文</b>与后台处理信息，均不会显示在聊天区。</div>
                    <div class="detail-section-title">📊 请求概况</div>
                    <div class="detail-kv"><span class="detail-k">模式</span><span class="detail-v">${msg._mode === '只读' ? '🔒 只读（不注入）' : '🔓 读写（可注入）'}</span></div>
                    ${msg._historyCount !== undefined ? `<div class="detail-kv"><span class="detail-k">历史消息</span><span class="detail-v">发送 ${msg._historyCount} 条（近因滑动窗口）</span></div>` : ''}
                    ${msg._injectedCount !== undefined ? `<div class="detail-kv"><span class="detail-k">注入设定</span><span class="detail-v">${msg._injectedCount} 个（动态扫描 + 聚焦条目）</span></div>` : ''}
                    ${msg._injectedTitles && msg._injectedTitles.length ? `<div class="detail-kv"><span class="detail-k">注入清单</span><span class="detail-v">${escHtml(msg._injectedTitles.join('、'))}</span></div>` : ''}
                    ${msg._opsApplied !== undefined ? `<div class="detail-kv"><span class="detail-k">数据修改</span><span class="detail-v">${msg._opsApplied ? '✅ 已静默应用到工作台' : '— 未执行任何修改'}</span></div>` : ''}
                    ${msg._meta ? `<div class="detail-section-title">🧾 隐藏元指令（追加在最后一条用户消息末尾）</div><pre class="detail-pre">${escHtml(msg._meta)}</pre>` : ''}
                    ${msg._system ? `<div class="detail-section-title">📦 系统提示词（本次请求实际发送）</div><pre class="detail-pre">${escHtml(msg._system)}</pre>` : ''}
                `;
            } else {
                hiddenHTML = `<div class="text-muted">用户消息不包含隐藏信息。</div>`;
            }

            // 标签 3：提取的操作指令
            let opsHTML;
            if (hasOps) {
                opsHTML = `
                    <div class="detail-note">AI 回复末尾附带的<b>静默操作指令</b>（JSON / YAML 双引擎提取），已从聊天区剥离并按需注入工作台。</div>
                    <div class="detail-kv"><span class="detail-k">应用状态</span><span class="detail-v">${msg._opsApplied ? '✅ 已应用到工作台' : '⚠️ 已提取但未触发修改'}</span></div>
                    <pre class="detail-pre">${escHtml(JSON.stringify(msg._ops, null, 2))}</pre>`;
            } else {
                opsHTML = `<div class="text-muted">未从该回复中提取到任何操作指令（只读模式或 AI 未输出 JSON）。</div>`;
            }

            document.getElementById('modalTitle').textContent = isAssistant ? '🕵️ 对话详情 · AI 回复' : '🕵️ 对话详情 · 用户消息';
            document.getElementById('modalBody').innerHTML = `
                <div class="detail-tabs">
                    <button id="detailTab_raw" class="detail-tab" onclick="switchChatDetailTab('raw')">🧾 完整回复</button>
                    <button id="detailTab_hidden" class="detail-tab" onclick="switchChatDetailTab('hidden')">🕵️ 隐藏信息</button>
                    <button id="detailTab_ops" class="detail-tab" onclick="switchChatDetailTab('ops')">⚙️ 提取操作</button>
                </div>
                <div id="detailPanel_raw" class="detail-panel" style="display:block;">${rawHTML}</div>
                <div id="detailPanel_hidden" class="detail-panel" style="display:none;">${hiddenHTML}</div>
                <div id="detailPanel_ops" class="detail-panel" style="display:none;">${opsHTML}</div>
            `;
            document.getElementById('modalConfirmBtn').textContent = '关闭';
            document.getElementById('modalConfirmBtn').onclick = function () { closeModal(); };
            document.getElementById('modalOverlay').classList.add('show');
            switchChatDetailTab('raw');
        }

        function showToast(msg) {
            // 🚀 核心修复：在弹出新提示前，先销毁页面上已有的残留提示框，防止文字重叠（糊字）
            document.querySelectorAll('.toast-msg').forEach(el => el.remove());
            const div = document.createElement('div');
            div.className = 'toast-msg'; // 赋予类名方便后续选中
            div.textContent = msg;
            div.style.cssText = `position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-surface); color: var(--text-primary); padding: 10px 24px; border-radius: 8px; border: 1px solid var(--accent); z-index: 9999; font-size: 14px; box-shadow: var(--shadow); animation: fadeIn 0.2s ease-out;`;
            document.body.appendChild(div);
            setTimeout(() => { if (div.parentNode) div.remove(); }, 2500);
        }

        // 快捷键绑定
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 's') { e.preventDefault(); handleSaveWorkspace(); }
            if (e.ctrlKey && e.key === 'n') { e.preventDefault(); showModal('新建条目'); }
            // Ctrl+Enter 发送聊天由 handleChatKeyDown 处理（textarea 内）
        });
</script>

    <!-- 🚀 星图：全屏知识图谱画布（ECharts 力导向图） -->
    <div id="graphModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-base); z-index: 3000;">
        <div style="position: absolute; top: 20px; right: 30px; z-index: 3010; display: flex; gap: 15px; align-items: center;">
            <span style="color: var(--text-secondary); font-size: 14px;">💡 提示：鼠标滚轮缩放，拖拽画布平移，点击节点可直接跳转编辑</span>
            <button class="btn" onclick="closeGraph()" style="background: var(--bg-elevated); color: var(--red); border: 1px solid var(--red);">❌ 关闭星图</button>
        </div>
        <div id="graphContainer" style="width: 100%; height: 100%;"></div>
    </div>
</body>

</html>
