            badge.classList.toggle('readonly', !writable);
        }

        function updateChatRules(val) {
            chatRules = val;
            saveToLocal();
            showToast('已更新聊天微调规则');
        }

        // ==========================================
        //  对话管理：新对话 / 切换 / 删除 / 清空 / 回退 / 修改上轮 / 历史记录
        // ==========================================
        function currentChat() {
            return chatConversations.find(c => c.id === currentChatId) || null;
        }

        function createNewChat() {
            const conv = { id: Date.now(), title: '新对话', messages: [], createdAt: Date.now() };
            chatConversations.unshift(conv);
            currentChatId = conv.id;
            chatMessages = conv.messages;
            saveToLocal();
            renderChatSessions();
            renderChatMessages();
            return conv;
        }

        function switchChat(id) {
            const conv = chatConversations.find(c => c.id === id);
            if (!conv) return;
            currentChatId = id;
            chatMessages = conv.messages;
            saveToLocal();
            renderChatSessions();
            renderChatMessages();
        }

        function deleteChat(id) {
            const conv = chatConversations.find(c => c.id === id);
            if (!conv) return;
            if (!confirm(`确定删除对话「${conv.title || '未命名对话'}」吗？`)) return;
            chatConversations = chatConversations.filter(c => c.id !== id);
            if (currentChatId === id) {
                if (chatConversations.length) {
                    currentChatId = chatConversations[0].id;
                    chatMessages = chatConversations[0].messages;
                } else {
                    createNewChat();
                }
            }
            saveToLocal();
            renderChatSessions();
            renderChatMessages();
            showToast('对话已删除');
        }

        function clearChat() {
            if (!chatMessages.length) { showToast('当前对话已是空状态'); return; }
            if (!confirm('确定清空当前对话的全部消息吗？')) return;
            chatMessages.length = 0;
            saveToLocal();
            renderChatMessages();
            showToast('已清空当前对话');
        }

        function goBackChat() {
            if (!chatMessages.length) { showToast('没有可回退的轮次'); return; }
            if (chatMessages[chatMessages.length - 1].role === 'assistant') chatMessages.pop();
            if (chatMessages.length && chatMessages[chatMessages.length - 1].role === 'user') chatMessages.pop();
            saveToLocal();
            renderChatMessages();
            showToast('已返回上一轮');
        }

        function editLastChat() {
            if (!chatMessages || chatMessages.length === 0) return;
            for (let i = chatMessages.length - 1; i >= 0; i--) {
                if (chatMessages[i].role === 'user') {
                    const inputEl = document.getElementById('chatInput');
                    if (inputEl) inputEl.value = chatMessages[i].content;
                    // 🚀 核心修复：明确第二个参数，只删除当前及之后的对话，防止误删整个数组
                    chatMessages.splice(i, chatMessages.length - i);
                    saveToLocal();
                    renderChatMessages();
                    if (inputEl) inputEl.focus();
                    showToast('已载入上轮内容，修改后点击发送');
                    return;
                }
            }
            showToast('找不到上一条用户消息');
        }

        function toggleChatHistory() {
            const panel = document.getElementById('chatHistoryPanel');
            if (!panel) return;
            const willShow = panel.style.display === 'none' || !panel.style.display;
            panel.style.display = willShow ? 'flex' : 'none';
            if (willShow) renderChatSessions();
        }

        function renderChatSessions() {
            const panel = document.getElementById('chatHistoryPanel');
            const titleEl = document.getElementById('chatSessionTitle');
            if (titleEl) {
                const conv = currentChat();
                titleEl.textContent = conv ? (conv.title || '新对话') : '新对话';
            }
            if (!panel) return;
            if (chatConversations.length === 0) {
                panel.innerHTML = `<div class="text-muted text-sm" style="padding:8px;text-align:center;">暂无历史对话，点击「＋ 新对话」开始</div>`;
                return;
            }
            panel.innerHTML = chatConversations.map(c => {
                const active = c.id === currentChatId ? ' active' : '';
                const d = new Date(c.createdAt);
                const time = isNaN(d.getTime()) ? '' : d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                return `
                    <div class="chat-history-item${active}" onclick="switchChat(${c.id})">
                        <span class="chat-history-title">${escHtml(c.title || '新对话')} <span class="chat-history-count">(${c.messages.length})</span></span>
                        <span class="chat-history-time">${time}</span>
                        <button class="icon-btn" title="删除该对话" onclick="event.stopPropagation();deleteChat(${c.id})">🗑️</button>
                    </div>
                `;
            }).join('');
        }

        function renderChatMessages() {
            const container = document.getElementById('chatMessages');
            if (chatMessages.length === 0) {
                container.innerHTML = `<div class="text-muted text-sm" style="text-align:center; padding:20px;">欢迎使用对话助手！<br><br>📝 提示：打开顶部的“自定义微调规则”可重塑我的性格与回答风格。<br><br>当前选中的条目内容会自动作为后台上下文。</div>`;
                return;
            }
            container.innerHTML = chatMessages.map((msg, i) => {
                // AI 回复用 Markdown 渲染（marked.js，离线自动降级为纯文本），用户消息保持纯文本转义防 XSS
                const isAssistant = msg.role !== 'user';
                let bodyHTML;
                if (isAssistant) {
                    bodyHTML = (typeof marked !== 'undefined' && marked.parse) ? marked.parse(msg.content) : escHtml(msg.content);
                } else {
                    bodyHTML = escHtml(msg.content);
                }
                // 有隐藏信息（完整原始回复 / 系统提示词 / 元指令 / 提取操作）的 AI 消息显示「🕵️ 详情」入口
                const hasDetail = isAssistant && !!(msg._raw || msg._system || msg._meta || msg._ops || msg._injectedTitles);
                const detailBtn = hasDetail
                    ? `<div class="chat-detail-row"><button class="chat-detail-btn" onclick="viewChatDetails(${i})" title="查看完整AI回复与隐藏对话信息">🕵️ 详情</button></div>`
                    : '';
                // 注意：bodyHTML 必须紧贴标签（无换行/缩进），否则 white-space:pre-wrap 会把模板空白渲染成多余空行
                return `
                <div class="chat-row ${isAssistant ? 'assistant' : 'user'}">
                    <div class="chat-avatar">${isAssistant ? '🤖' : '🧑'}</div>
                    <div class="chat-bubble ${isAssistant ? 'assistant' : 'user'}">${bodyHTML}${detailBtn}</div>
                </div>
            `;
            }).join('') + `<div id="chatAnchor"></div>`; // 锚点用于滚动到底部

            setTimeout(() => {
                const anchor = document.getElementById('chatAnchor');
                if (anchor) anchor.scrollIntoView({ behavior: 'smooth' });
            }, 50);
        }

        function handleChatKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        }

        async function sendChatMessage() {
            const inputEl = document.getElementById('chatInput');
            const userText = inputEl.value.trim();
            if (!userText) return;

            // 确保存在当前对话（防御：chatMessages 必须指向真实会话）
            if (!currentChat()) createNewChat();

            chatMessages.push({ role: 'user', content: userText });
            inputEl.value = '';

            const conv = currentChat();
            if (conv && (!conv.title || conv.title === '新对话')) {
                conv.title = userText.length > 20 ? userText.substring(0, 20) + '…' : userText;
                renderChatSessions();
            }

            renderChatMessages();
            const btn = document.getElementById('chatSendBtn');
            btn.textContent = '...';
            btn.disabled = true;

            try {
                // 不再单独传递文字，直接呼叫拥有全局记忆的助手
                await callSettingAssistant();
            } finally {
                if (btn) {
                    btn.textContent = '发送';
                    btn.disabled = false;
                }
                saveToLocal();
                renderChatMessages();
                inputEl.focus();
            }
        }

        /**
         * 终极完全体：拥有完整上下文记忆、完美继承酒馆预设，且随时可执行数据修改的全能助手
         */
        /**
         * 【重构版】终极设定交流助手：真正的动态记忆 + 沉浸式创作
         */
        async function callSettingAssistant() {
            const toggleElement = document.getElementById('ai-modify-toggle');
            const allowModify = toggleElement ? toggleElement.checked : true;

            let systemPrompts = [];

            // 0. 注入严格输出格式要求（立规矩，最高优先级）
            //    强制 AI 用 <think>...</think> 包裹内部思考，禁止无闭合的 [metacognition]
            systemPrompts.push(`【严格格式要求（最高优先级，不可违反）】
如果你在回答前需要进行任何内部逻辑推演、任务拆解或元认知（metacognition）思考，你必须且只能将其全部包裹在 <think> 和 </think> 这对完整的 XML 标签中。
绝对不允许使用无闭合的 [metacognition] 格式。
<think> 与 </think> 之间的内容仅供你内部推理，不会展示给用户，请放心在其中自由思考。`);

            // 1. 注入面板规则 (基础人设)
            if (typeof chatRules !== 'undefined' && chatRules.trim()) {
                systemPrompts.push(`【助手基础设定】\n${chatRules.trim()}`);
            }

            // 2. 注入当前选择的酒馆提示词预设 (确保 AI 扮演正确的角色/文风)
            if (typeof chatUsePreset !== 'undefined' && chatUsePreset) {
                const preset = promptPresets[currentPromptId];
                if (preset && Array.isArray(preset.blocks)) {
                    const presetSys = preset.blocks
                        .filter(b => b.enabled && b.role === 'system')
                        .map(b => `[规则块: ${b.name}]\n${b.content}`)
                        .join('\n\n');
                    if (presetSys) {
                        systemPrompts.push(`【核心扮演与文风法则 (必须严格遵守)】\n${presetSys}`);
                    }
                }
            }

            // 3. ★ 核心重构：真正的动态上下文扫描 & 完整内容注入（废除 100 字暴力截断）
            //    提取最近的 3 轮对话，用 simulateScan 扫描触发关键词
            const recentHistoryText = chatMessages.slice(-3).map(m => m.content).join('\n');
            const hits = simulateScan(recentHistoryText);
            const currentEntry = getCurrentEntry(); // 当前正在编辑的条目（所见即所得）
            let injectedEntries = [];

            // 注入命中条目的【完整内容】，拒绝暴力截断
            hits.forEach(hit => {
                // 🚀 修复1：将 UID 与标题绑定注入，赋予 AI 辨识现有条目的能力（防幽灵新建）
                injectedEntries.push(`[UID:${hit.entry.uid} | 标题:${hit.entry.keys[0]}]\n${hit.entry.content}`);
            });

            // 确保当前左侧选中的条目始终在上下文中（所见即所得）
            if (currentEntry && !hits.some(h => String(h.entry.uid) === String(currentEntry.uid))) {
                injectedEntries.push(`[当前聚焦 | UID:${currentEntry.uid} | 标题:${currentEntry.keys[0] || '未命名'}]\n${currentEntry.content}`);
            }

            if (injectedEntries.length > 0) {
                systemPrompts.push(`【当前激活的世界观上下文】\n请严格参考以下设定进行创作与回复：\n\n${injectedEntries.join('\n\n---\n\n')}`);
            } else {
                systemPrompts.push(`【当前激活的世界观上下文】\n(当前对话未触发任何特定设定，请根据基础设定自由发挥)`);
            }

            // ===== 🚀 新增：全局目录雷达（赋予 AI 上帝视角） =====
            const allEntriesList = getEntriesArray();
            if (allEntriesList.length > 0) {
                // 将所有条目压缩成 "UID:标题" 的轻量级字符串
                const catalogStr = allEntriesList.map(e => `${e.uid}:${(Array.isArray(e.keys) && e.keys[0]) ? e.keys[0] : '未命名'}`).join(', ');
                systemPrompts.push(`【全局目录雷达】(赋予你的全局视野)\n当前工作台包含以下所有条目(UID:主触发词)：\n${catalogStr}\n\n[指令：当用户要求“遍历/检查/合并/梳理”条目时，请根据此目录推演。若需合并，你可以直接结合 UID 调用 update_worldbook 进行操作（如：更新条目A，删除多余的条目B）。]`);
            }
            // ===== 🚀 新增结束 =====

            // 🛡️ 输出格式红线：彻底掐断 AI 用 title/name 命名的念头
            systemPrompts.push(`【输出格式红线】：
在输出世界书条目 JSON 时，条目的显示名称必须严格使用 "comment" 字段，绝对禁止使用 "title" 或 "name" 字段！`);

            // 4. 初始化要发给 API 的 Messages 数组
            const systemPromptText = systemPrompts.join('\n\n=====\n\n');
            let apiMessages = [
                { role: 'system', content: systemPromptText }
            ];

            // 5. 注入历史聊天记录 (限制近 10 条防止 Token 撑爆)
            //    🚀 隔离占位符：占位气泡已在构建 apiMessages 之后才 push，此处再加一道防御，
            //    任何异常路径（并发/残留）下都绝不把 '...' 占位消息发给 API，从源头杜绝 400。
            const maxHistoryLength = 10;
            const history = chatMessages.slice(-maxHistoryLength)
                .filter(m => m && !m._pending && m.content !== '...')
                .map(msg => ({ role: msg.role, content: msg.content }));
            apiMessages.push(...history);

            // 定义结构化的原生工具 Schema（原生 Function Calling / Tool Calling）
            // 让助手通过标准 JSON 协议交互数据，而不是手写 Markdown 代码块
            const dbUpdateTool = [{
                type: "function",
                function: {
                    name: "update_worldbook",
                    description: "当用户要求修改、添加或删除世界观设定时，必须调用此原生函数进行数据交互，绝对不要在文本中输出 JSON 代码块。",
                    parameters: {
                        type: "object",
                        properties: {
                            worldbook_updates: {
                                type: "array",
                                description: "需要操作的世界书条目列表",
                                items: {
                                    type: "object",
                                    properties: {
                                        action: { type: "string", enum: ["add_or_update", "delete"] },
                                        // 🚀 修复1：赋予 AI UID 辨识能力，解决“幽灵新建”问题
                                        uid: { type: "string", description: "要操作条目的 UID（更新或删除现有条目时必填；新建留空）" },
                                        title: { type: "string", description: "设定的主标题/主触发词" },
                                        keys: { type: "array", items: { type: "string" }, description: "相关触发词" },
                                        content: { type: "string", description: "设定正文" },
                                        depth: { type: "number", description: "插入深度，推荐 4" },
                                        order: { type: "number", description: "注入顺序，推荐 100" },
                                        position: { type: "number", description: "1: 角色前, 2: 角色后" }
                                    },
                                    required: ["action", "title", "content"]
                                }
                            },
                            reply_text: {
                                type: "string",
                                description: "以助手的语气对用户进行口语化回复（如：好的，已为您添加某某设定）。"
                            }
                        },
                        required: ["reply_text"]
                    }
                }
            }];

            // 6. ★ 原生工具指令：读写模式强制走 Function Calling，只读模式禁止调用
            let metaInstruction = "";
            if (allowModify) {
                metaInstruction = `

[系统隐秘指令：如果您需要变更设定，必须且只能调用提供的 update_worldbook 原生函数，切勿手写 JSON/YAML Markdown 代码块！每次调用时请在参数中附带 reply_text 用于回复用户。更新或删除现有条目时，务必从激活上下文读取该条目的 UID 填入 uid 字段，防止误建幽灵条目。]`;
            } else {
                metaInstruction = `

[⚠️ 当前为安全只读模式] 你已被剥夺数据修改权限，请绝对不要调用任何工具或输出任何操作代码块，单纯沉浸在你的预设角色中与用户交流。`;
            }

            // 将轻量级提醒挂在最后一条消息末尾
            if (apiMessages.length > 0 && apiMessages[apiMessages.length - 1].role === 'user') {
                apiMessages[apiMessages.length - 1].content += metaInstruction;
            }

            try {
                // 提前推入一个占位气泡，配合流式回调实时更新 DOM（告别“死机等待”）
                chatMessages.push({ role: 'assistant', content: '...', _pending: true });
                renderChatMessages();

                // 呼叫 API 并传入流式回调 + 工具箱（读写模式挂载原生 update_worldbook 工具）
                const responseObj = await fetchAICompletion('设定交流助手', apiMessages, (partialText, isToolCalling) => {
                    const cur = chatMessages[chatMessages.length - 1];
                    if (cur && cur.role === 'assistant') {
                        cur.content = partialText || '';
                        // 🆕 同步保存原始流式文本（含 <think> 块/代码块），即使请求中断/异常，已接收的原始内容也不会丢失
                        cur._raw = partialText || '';
                    }
                    const chatContainer = document.getElementById('chatMessages');
                    if (!chatContainer) return;
                    const bubbles = chatContainer.querySelectorAll('.chat-row.assistant .chat-bubble');
                    if (bubbles.length > 0) {
                        const lastBubble = bubbles[bubbles.length - 1];
                        // 🚀 修复1（流式）：仅屏蔽未闭合的 <think>，绝对保留 AI 所有的 Markdown 格式和代码块！
                        const streamDisplay = String(partialText || '').replace(/<think>[\s\S]*?(?:<\/think>|$)/gi, '').trim();
                        // 🚀 修复4：交互增强——工具装配动画 + 思考白屏填充
                        if (isToolCalling && !streamDisplay) {
                            lastBubble.innerHTML = '<span style="color: var(--accent);">⚙️ 正在调用原生数据库接口装配设定...</span>';
                        } else if (!streamDisplay && String(partialText || '').includes('<think>')) {
                            lastBubble.innerHTML = '<span style="color: var(--text-muted);">🧠 深度思考/查阅记忆中...</span>';
                        } else {
                            lastBubble.innerHTML = (typeof marked !== 'undefined' && marked.parse) ? marked.parse(streamDisplay) : escHtml(streamDisplay);
                        }
                    }
                    const anchor = document.getElementById('chatAnchor');
                    if (anchor) anchor.scrollIntoView({ behavior: 'auto' });
                }, allowModify ? dbUpdateTool : null);
                if (!responseObj) {
                    // 请求失败：移除占位气泡，避免残留
                    const pend = chatMessages[chatMessages.length - 1];
                    if (pend && pend._pending) chatMessages.pop();
                    renderChatMessages();
                    return;
                }

                // 7. 结果归一化：可能是 {content, toolCalls}（挂载工具）或纯字符串（旧路径）
                const rawAiText = (responseObj && typeof responseObj === 'object') ? String(responseObj.content || '') : String(responseObj || '');
                // 🚀 引擎核心：优先拦截原生 Function Calling 返回的参数
                let toolArgs = null;
                if (responseObj && typeof responseObj === 'object' && Array.isArray(responseObj.toolCalls) && responseObj.toolCalls.length > 0) {
                    try {
                        toolArgs = JSON.parse(responseObj.toolCalls[0].function.arguments);
                    } catch (err) {
                        console.warn("API 工具参数解析异常，降级为文本提取:", err);
                        toolArgs = null;
                    }
                }

                // 终态显示：只剥除思考过程，保留一切正文、表格、JSON/YAML 代码块等预设格式
                let displayReplyText = rawAiText
                    // 1. 剔除标准的 <think>...</think> 标签及其内部所有内容
                    .replace(/<think>[\s\S]*?<\/think>/gi, '')
                    // 2. 暴力兼容：AI 若仍输出 [metacognition] 等无闭合思考，截断到连续两个换行符
                    .replace(/\[metacognition\][\s\S]*?\n\n/gi, '')
                    .trim();
                let chatReplyText = displayReplyText;
                // 用工具内部附带的话语作为气泡文字
                if (toolArgs && toolArgs.reply_text) chatReplyText = String(toolArgs.reply_text);
                // 容错：AI 偷懒只发 JSON 导致文本为空时，提供兜底回复
                if (!chatReplyText || chatReplyText.length === 0) {
                    chatReplyText = "✅ 数据库已更新，请查阅。";
                }
                // 附带完整原始回复与隐藏上下文（供「🕵️ 详情」查看）
                // 若流式占位气泡仍在，则原位回填，避免出现重复气泡
                const injectedTitles = injectedEntries.map(s => {
                    const m = String(s).match(/^\[([^\]]+)\]/);
                    return m ? m[1] : '未命名';
                });
                const msgData = {
                    role: 'assistant',
                    content: chatReplyText,
                    _raw: rawAiText,                                  // 完整原始 AI 回复（含 think 块与 JSON，已从显示区剥离）
                    _system: systemPromptText,                        // 本次实际发送的系统提示词
                    _meta: metaInstruction,                           // 隐藏元指令（追加在最后一条用户消息末尾）
                    _mode: allowModify ? '读写' : '只读',
                    _historyCount: history.length,                    // 发送的历史消息条数
                    _injectedCount: injectedEntries.length,           // 注入的设定条目数
                    _injectedTitles: injectedTitles                   // 注入条目名称清单
                };
                const pendingMsg = chatMessages[chatMessages.length - 1];
                if (pendingMsg && pendingMsg._pending) {
                    Object.assign(pendingMsg, msgData);
                    delete pendingMsg._pending;
                } else {
                    chatMessages.push(msgData);
                }
                renderChatMessages();
                // 🆕 消息确定后立即持久化（含完整 _raw 与隐藏上下文），防止后续流程异常或提前关闭导致对话/原始回复丢失
                saveToLocal();

                // 只读模式：不执行任何数据修改
                if (!allowModify) return;

                let hiddenApplied = false; // 记录本次是否实际向工作台写入了修改（供详情查看）

                // B. 提取静默注入指令（★ 原生工具参数优先，旧版文本引擎兜底）
                const aiReplyText = String(rawAiText);
                let parsedData = toolArgs; // 原生 Function Calling 参数优先
                try {
                    // 原生工具参数已就绪时，直接跳过文本候选池
                    if (!parsedData) {
                    // 1. 将全文及提取出的所有独立代码块，放入“候选解析池”
                    const codeBlocks = [];
                    const blockRegex = /```(?:json|yaml|yml)?\s*([\s\S]*?)\s*```/gi;
                    let blockMatch;
                    while ((blockMatch = blockRegex.exec(aiReplyText)) !== null) {
                        if (blockMatch[1] && blockMatch[1].trim()) codeBlocks.push(blockMatch[1].trim());
                    }
                    // 全文兜底：剥除思考过程后整体作为候选
                    const fullText = aiReplyText
                        .replace(/<think>[\s\S]*?<\/think>/gi, '')
                        .replace(/\[metacognition\][\s\S]*?\]/gi, '')
                        .trim();
                    if (fullText) codeBlocks.push(fullText);

                    // 2. 遍历所有候选内容，寻找合法操作指令
                    for (let source of codeBlocks) {
                        // 引擎 A：智能 JSON 提取与纠错（括号深度精准定位，避免贪婪误吞尾部内容）
                        const firstBrace = source.indexOf('{');
                        if (firstBrace > -1) {
                            let depth = 0, inString = false, escaped = false, endIdx = -1;
                            for (let i = firstBrace; i < source.length; i++) {
                                const ch = source[i];
                                if (inString) {
                                    if (escaped) escaped = false;
                                    else if (ch === '\\') escaped = true;
                                    else if (ch === '"') inString = false;
                                } else {
                                    if (ch === '"') inString = true;
                                    else if (ch === '{') depth++;
                                    else if (ch === '}') {
                                        depth--;
                                        if (depth === 0) { endIdx = i; break; }
                                    }
                                }
                            }
                            if (endIdx > -1) {
                                let jsonCandidate = source.substring(firstBrace, endIdx + 1);
                                // 【语法容错】：自动修复 AI 常犯的 JSON 尾随逗号错误 (Trailing Comma)
                                let attempt = jsonCandidate.replace(/,\s*([\}\]])/g, '$1');
                                for (let i = 0; i < 3; i++) {
                                    try {
                                        const obj = JSON.parse(attempt);
                                        if (obj && typeof obj === 'object' && !Array.isArray(obj)) { parsedData = obj; break; }
                                    } catch (e) {
                                        // 容错：去掉尾部多余的逗号或非闭合字符
                                        const stripped = attempt.replace(/[\},]\s*$/, '}');
                                        if (stripped === attempt) break;
                                        attempt = stripped;
                                    }
                                }
                                if (parsedData) break;
                            }
                        }

                        // 引擎 B：JSON 失败时，用 YAML 行级状态机兜底
                        if (!parsedData) {
                            const yamlResult = parseYamlInstructions(source);
                            if (yamlResult && Array.isArray(yamlResult.worldbook_updates) && yamlResult.worldbook_updates.length > 0) {
                                parsedData = yamlResult;
                                break;
                            }
                        }
                    }
                    } // 结束 if(!parsedData)：工具参数已就绪时跳过文本解析
                } catch (err) {
                    console.warn("⚠️ 双向引擎解析告警:", err);
                    parsedData = null;
                }

                // 只有成功解析出合法操作对象时才执行静默注入
                if (parsedData && typeof parsedData === 'object' && !Array.isArray(parsedData)) {
                    const operations = parsedData;
                    let modifiedWorldbook = false;
                    let modifiedPrompts = false;

                    // ① 世界书增删改
                    if (Array.isArray(operations.worldbook_updates) && operations.worldbook_updates.length > 0) {
                        const entriesArr = getEntriesArray();
                        const wb = getCurrentWorldbook();
                        operations.worldbook_updates.forEach(op => {
                            // 🚀 增强匹配：兼容 AI 用 uid / title / name / comment 定位已有条目（防重复新建）
                            const idx = entriesArr.findIndex(e => String(e.uid) === String(op && op.uid)
                                || (e.keys && op && ((op.title && e.keys[0] === op.title) || (op.name && e.keys[0] === op.name) || (op.comment && e.keys[0] === op.comment)))
                                || (op && op.comment && e.comment === op.comment));
                            if (op.action === 'add_or_update') {
                                const pos = mapPositionValue(op.position);
                                // �️ 姓名绝对防御 + 键名防火墙：只有 AI 明确给出合法名字才更新，绝不拿 JSON 字段名当条目名！
                                // 名字只允许来自 comment / name / title 这三个明确字段
                                let entryName = '';
                                if (op.comment && String(op.comment).trim()) entryName = String(op.comment).trim();
                                else if (op.name && String(op.name).trim()) entryName = String(op.name).trim();
                                else if (op.title && String(op.title).trim()) entryName = String(op.title).trim();
                                // 🚨 拦截内鬼：若"名字"命中保留的英文键名，视为 AI 没发名字，直接丢弃！
                                const reservedFieldNames = ['content', 'action', 'keys', 'tags', 'uid', 'order', 'depth', 'position', 'worldbook_updates', 'description', 'text', 'name', 'title', 'comment', 'prompt_blocks_updates', 'preset_settings_updates'];
                                if (entryName && reservedFieldNames.includes(entryName.toLowerCase())) {
                                    console.warn('⚠️ 拦截到把 JSON 字段名当条目名的错误行为，已丢弃该名字！');
                                    entryName = '';
                                }
                                // 统一抹平为酒馆世界书标准的 comment 字段
                                if (op.title !== undefined) delete op.title;
                                if (op.name !== undefined) delete op.name;
                                if (idx > -1) {
                                    const target = entriesArr[idx];
                                    if (op.content !== undefined) target.content = op.content;
                                    if (op.depth !== undefined) target.depth = parseInt(op.depth) || target.depth;
                                    if (op.order !== undefined) target.order = parseInt(op.order) || target.order;
                                    if (pos !== null) target.position = pos;
                                    if (Array.isArray(op.keys) && op.keys.length) target.keys = op.keys;
                                    // 只有拿到合法名字才改名；AI 没给名字就保留原条目名（绝不用 keys[0] 或字段名覆盖）
                                    if (entryName) {
                                        target.comment = entryName;
                                        if (!Array.isArray(op.keys) || !op.keys.length) target.keys = [entryName];
                                    }
                                    // 🆕 ST 扩展字段：概率/逻辑/递归/@D角色/输出口/定时效果/匹配设置
                                    if (op.probability !== undefined) target.probability = parseInt(op.probability) || target.probability;
                                    if (op.selectiveLogic !== undefined) target.selectiveLogic = parseInt(op.selectiveLogic) || target.selectiveLogic;
                                    if (op.excludeRecursion !== undefined) target.excludeRecursion = Boolean(op.excludeRecursion);
                                    if (op.role !== undefined) target.role = parseInt(op.role) || 0;
                                    if (op.outlet_name !== undefined) target.outlet_name = String(op.outlet_name || '');
                                    if (op.sticky !== undefined) target.sticky = parseInt(op.sticky) || 0;
                                    if (op.cooldown !== undefined) target.cooldown = parseInt(op.cooldown) || 0;
                                    if (op.delay !== undefined) target.delay = parseInt(op.delay) || 0;
                                    if (Array.isArray(op.secondary_keys)) target.secondary_keys = op.secondary_keys;
                                    if (op.case_sensitive !== undefined) target.case_sensitive = Boolean(op.case_sensitive);
                                    if (op.match_whole_words !== undefined) target.match_whole_words = Boolean(op.match_whole_words);
                                    if (op.prevent_recursion !== undefined) target.prevent_recursion = Boolean(op.prevent_recursion);
                                    if (op.delay_until_recursion !== undefined) target.delay_until_recursion = Boolean(op.delay_until_recursion);
                                } else {
                                    // 新建条目：没有合法名字时，才用触发词 keys[0] 兜底（并排除保留字段名）
                                    let newName = entryName;
                                    if (!newName) {
                                        const firstKey = (Array.isArray(op.keys) && op.keys.length) ? String(op.keys[0]).trim() : '';
                                        if (firstKey && !reservedFieldNames.includes(firstKey.toLowerCase())) newName = firstKey;
                                    }
                                    const safeName = newName || '未命名条目';
                                    const newUid = Date.now() + entriesArr.length;
                                    const base = createNewEntry(newUid);
                                    wb.entries[newUid] = Object.assign(base, {
                                        uid: newUid,
                                        keys: Array.isArray(op.keys) && op.keys.length ? op.keys : [safeName],
                                        content: op.content || '',
                                        comment: safeName,
                                        constant: op.constant !== undefined ? Boolean(op.constant) : false,
                                        disable: op.disable !== undefined ? Boolean(op.disable) : false,
                                        order: parseInt(op.order) || 100,
                                        selectiveLogic: op.selectiveLogic !== undefined ? parseInt(op.selectiveLogic) : 0,
                                        excludeRecursion: op.excludeRecursion !== undefined ? Boolean(op.excludeRecursion) : false,
                                        probability: op.probability !== undefined ? parseInt(op.probability) : 100,
                                        depth: parseInt(op.depth) || 4,
                                        position: pos !== null ? pos : 1,
                                        role: op.role !== undefined ? parseInt(op.role) : 0,
                                        outlet_name: op.outlet_name !== undefined ? String(op.outlet_name) : '',
                                        sticky: op.sticky !== undefined ? parseInt(op.sticky) : 0,
                                        cooldown: op.cooldown !== undefined ? parseInt(op.cooldown) : 0,
                                        delay: op.delay !== undefined ? parseInt(op.delay) : 0,
                                        secondary_keys: Array.isArray(op.secondary_keys) ? op.secondary_keys : [],
                                        case_sensitive: op.case_sensitive !== undefined ? Boolean(op.case_sensitive) : false,
                                        match_whole_words: op.match_whole_words !== undefined ? Boolean(op.match_whole_words) : false,
                                        prevent_recursion: op.prevent_recursion !== undefined ? Boolean(op.prevent_recursion) : false,
                                        delay_until_recursion: op.delay_until_recursion !== undefined ? Boolean(op.delay_until_recursion) : false
                                    });
                                }
                                modifiedWorldbook = true;
                            } else if (op.action === 'delete') {
                                if (idx > -1) { delete wb.entries[String(entriesArr[idx].uid)]; modifiedWorldbook = true; }
                                else if (op.uid) { delete wb.entries[String(op.uid)]; modifiedWorldbook = true; }
                                else if (op.title) {
                                    const tIdx = entriesArr.findIndex(e => e.keys && e.keys[0] === op.title);
                                    if (tIdx > -1) { delete wb.entries[String(entriesArr[tIdx].uid)]; modifiedWorldbook = true; }
                                }
                            }
                        });
                    }

                    // ② 提示词规则块增删改（兼容 prompt_blocks_updates 与旧 prompt_updates）
                    const promptOps = Array.isArray(operations.prompt_blocks_updates)
                        ? operations.prompt_blocks_updates
                        : (Array.isArray(operations.prompt_updates) ? operations.prompt_updates : []);
                    if (promptOps.length > 0) {
                        const curPreset = promptPresets[currentPromptId];
                        if (curPreset) {
                            if (!Array.isArray(curPreset.blocks)) curPreset.blocks = [];
                            promptOps.forEach(op => {
                                const block = curPreset.blocks.find(b => b.name === op.name);
                                if (op.action === 'add_or_update') {
                                    if (block) {
                                        if (op.content !== undefined) block.content = op.content;
                                        if (op.role !== undefined) block.role = op.role;
                                        if (op.state !== undefined) block.enabled = op.state !== false;
                                    } else {
                                        curPreset.blocks.push({
                                            uid: Date.now() + curPreset.blocks.length,
                                            name: op.name || '新规则块',
                                            role: op.role || 'system',
                                            content: op.content || '',
                                            enabled: op.state !== false
                                        });
                                    }
                                    modifiedPrompts = true;
                                } else if (op.action === 'delete') {
                                    const bi = curPreset.blocks.findIndex(b => b.name === op.name);
                                    if (bi > -1) { curPreset.blocks.splice(bi, 1); modifiedPrompts = true; }
                                }
                            });
                        }
                    }

                    // ③ 预设全局设置更新（system_prompt / input_sequence / output_sequence）
                    if (operations.preset_settings_updates && typeof operations.preset_settings_updates === 'object' && Object.keys(operations.preset_settings_updates).length > 0) {
                        const curPreset = promptPresets[currentPromptId];
                        if (curPreset) {
                            const g = operations.preset_settings_updates;
                            ['system_prompt', 'input_sequence', 'output_sequence'].forEach(k => {
                                if (g[k] !== undefined && g[k] !== null) curPreset[k] = String(g[k]);
                            });
                            modifiedPrompts = true;
                        }
                    }

                    // ④ 驱动 UI 刷新与本地持久化
                    if (modifiedWorldbook || modifiedPrompts) {
                        hiddenApplied = true;
                        saveToLocal();
                        if (modifiedWorldbook) renderAll();
                        if (modifiedPrompts) {
                            renderDropdowns();
                            if (document.getElementById('modalTitle') && document.getElementById('modalTitle').textContent.includes('提示词管理')) {
                                showModal('提示词管理');
                            }
                        }
                        showToast('交流助手已同步修改工作区数据');
                        console.log("✅ 交流助手已成功同步数据修改！");
                    }
                }

                // 将解析结果与注入状态回填到该条消息（供「🕵️ 详情」查看）
                const detailMsg = chatMessages[chatMessages.length - 1];
                if (detailMsg && detailMsg.role === 'assistant') {
                    detailMsg._ops = (parsedData && typeof parsedData === 'object' && !Array.isArray(parsedData)) ? parsedData : null;
                    detailMsg._opsApplied = hiddenApplied;
                }

            } catch (err) {
                console.error("设定交流助手执行失败:", err);
                const lastMsg = chatMessages[chatMessages.length - 1];
                if (lastMsg && lastMsg._pending) {
                    lastMsg.content = '❌ 交流失败：' + err.message;
                    delete lastMsg._pending;
                } else {
                    chatMessages.push({ role: 'assistant', content: '❌ 交流失败：' + err.message });
                }
                renderChatMessages();
            }
        }
        // ============================================================
        //  酒馆预设万能导入引擎 + 导入处理（多层防御 / 字段降级映射）
        // ============================================================
        /**
         * 酒馆预设万能导入引擎
         * 支持 Prompt Manager, Context Template, Instruct 以及 TextGen 采样配置的提取
         */
        function importSillyTavernPreset(jsonData) {
            try {
                let data = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
                let newBlocks = [];
                let globalSettings = {};

                // 1. 提取采样控制参数（如果 JSON 包含了 API 设置）
                const sampleKeys = ['temperature', 'top_p', 'top_k', 'frequency_penalty', 'presence_penalty', 'repetition_penalty', 'max_tokens'];
                sampleKeys.forEach(key => {
                    if (data[key] !== undefined) {
                        globalSettings[key] = data[key];
                    }
                });

                // 2. 提取全局指令序列 (Instruct Sequences)
                ['input_sequence', 'output_sequence', 'system_sequence', 'macro_custom'].forEach(seqKey => {
                    if (data[seqKey] !== undefined) {
                        globalSettings[seqKey] = data[seqKey];
                    }
                });

                // 3. 结构识别 - 模式 A：现代 Prompt Manager (prompts 或 blocks 数组)
                const rawBlocks = data.prompts || data.blocks || (Array.isArray(data) ? data : null);

                if (rawBlocks && Array.isArray(rawBlocks)) {
                    rawBlocks.forEach((item, index) => {
                        if (!item) return;
                        const name = item.name || item.identifier || item.label || `规则块 #${index + 1}`;
                        const content = item.content || item.text || item.value || '';
                        const role = (item.role || (item.system_prompt ? 'system' : 'user')).toLowerCase();
                        // 兼容 state (0/1/true/false) 或 enabled 字段
                        const enabled = item.enabled !== undefined ? Boolean(item.enabled) : (item.state !== undefined ? Boolean(item.state) : true);

                        if (content.trim() || name) {
                            newBlocks.push({
                                id: 'blk_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                                name: name,
                                role: ['system', 'user', 'assistant'].includes(role) ? role : 'system',
                                content: content,
                                enabled: enabled,
                                order: item.order !== undefined ? item.order : index * 10
                            });
                        }
                    });
                }
                // 结构识别 - 模式 B：经典 Context Template (扁平化 Key-Value 结构)
                else if (typeof data === 'object') {
                    let orderCounter = 0;

                    // 匹配核心字段映射
                    const legacyMappings = [
                        { key: 'system_prompt', name: '全局系统提示 (System Prompt)', role: 'system' },
                        { key: 'main', name: '主提示词 (Main Prompt)', role: 'system' },
                        { key: 'story_string', name: '故事主轴 (Story String)', role: 'system' },
                        { key: 'jailbreak', name: '越狱/规则限制 (Jailbreak)', role: 'system' },
                        { key: 'post_history_instructions', name: '历史后指令 (PHI / D0)', role: 'user' },
                        { key: 'impersonation_prompt', name: '拟人/模仿提示', role: 'system' }
                    ];

                    legacyMappings.forEach(mapping => {
                        if (data[mapping.key] && typeof data[mapping.key] === 'string' && data[mapping.key].trim()) {
                            newBlocks.push({
                                id: 'blk_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                                name: mapping.name,
                                role: mapping.role,
                                content: data[mapping.key],
                                enabled: true,
                                order: orderCounter
                            });
                            orderCounter += 10;
                        }
                    });
                }

                if (newBlocks.length === 0) {
                    throw new Error('未能识别到有效的预设规则块，请检查文件结构。');
                }

                // 4. 将提取出的全局设置同步更新至 API 控制台参数（若存在）
                if (Object.keys(globalSettings).length > 0 && typeof apiConfigs !== 'undefined' && apiConfigs[currentApiId]) {
                    Object.assign(apiConfigs[currentApiId], globalSettings);
                    if (typeof saveToLocal === 'function') saveToLocal();
                }

                return {
                    success: true,
                    blocks: newBlocks,
                    settings: globalSettings,
                    count: newBlocks.length
                };

            } catch (err) {
                console.error('酒馆预设解析失败:', err);
                return {
                    success: false,
                    error: err.message
                };
            }
        }

        /**
         * 导入预设文件的事件响应
         * 支持无参调用自动弹出文件选择框（兼容 HTML onclick），或直接传入 file input 元素
         */
        async function handleImportPromptPreset(fileInput) {
            // 兼容旧入口：无参弹文件框 / 传 file input，全部委托给新的"导入新建总条目"逻辑
            if (!fileInput) { handlePresetImport(); return; }
            const file = fileInput.files[0];
            if (file) handlePresetImport(file);
        }

        // 🧩 辅助函数：安全追加预设规则块（自动去重与 ID 防重）
        function appendPresetBlocks(newBlocks) {
            const preset = promptPresets[currentPromptId];
            if (!preset) return;
            if (!Array.isArray(preset.blocks)) preset.blocks = [];

            let addedCount = 0;
            let skippedCount = 0;

            newBlocks.forEach(newB => {
                // 生成全新防重复的唯一 ID
                const uniqueId = 'preset_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

                // 🔒 查重：判断名称和内容是否完全一致（防止重复导入一模一样的卡片）
                const isExactDuplicate = preset.blocks.some(existB =>
                    existB.name === newB.name && existB.content === newB.content
                );

                if (isExactDuplicate) {
                    skippedCount++;
                    return; // 跳过完全重复项
                }

                // 🏷️ 处理同名但内容不同的情况，给名称做区分重命名
                let finalName = newB.name || '未命名规则';
                const hasSameName = preset.blocks.some(existB => existB.name === finalName);
                if (hasSameName) {
                    finalName = `${finalName} (新导入)`;
                }

                // 插入追加队列
                preset.blocks.push({
                    ...newB,
                    id: uniqueId,
                    name: finalName,
                    enabled: newB.enabled !== undefined ? newB.enabled : true
                });
                addedCount++;
            });

            saveToLocal();            // 保存到持久化缓存
            if (typeof initBlockEditor === 'function') initBlockEditor(); // 同步工作副本（含追加后的新块）
            renderBlockEditor();      // 重新渲染块编辑器 UI
            renderDropdowns();        // 刷新预设下拉

            if (skippedCount > 0) {
                showToast(`成功追加 ${addedCount} 条新规则（自动跳过了 ${skippedCount} 条完全相同的重复规则）`);
            } else {
                showToast(`成功追加 ${addedCount} 条新预设规则！`);
            }
        }

        // ============================================================
        //  📦 多预设总条目系统（总条目库管理 + 导入新建 + 渲染 + AI 编译）
        // ============================================================

        // 🧠 辅助函数：安全解码（专门对付 %E4%B8%AD 这种 URL 乱码，以及表单编码的加号变空格）
        function safeDecode(str) {
            if (!str) return '';
            try {
                // 若是 URL 编码格式的乱码则还原成正常中文；同时把加号还原为空格（application/x-www-form-urlencoded 习惯）
                return decodeURIComponent(str.replace(/\+/g, '%20'));
            } catch (e) {
                return str;
            }
        }

        // 📥 万能酒馆预设导入：每次导入直接新建一个"预设总条目"（带防乱码机制，支持无参弹文件框）
        function handlePresetImport(file) {
            if (!file) {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.style.display = 'none';
                document.body.appendChild(input);
                input.onchange = () => { handlePresetImport(input.files[0]); document.body.removeChild(input); };
                input.click();
                return;
            }
            const reader = new FileReader();

            reader.onload = function (e) {
                try {
                    const json = JSON.parse(e.target.result);

                    // 1. 按文件原始物理顺序解析规则块
                    let extractedBlocks = [];
                    if (Array.isArray(json.prompts)) extractedBlocks = json.prompts;
                    else if (Array.isArray(json.blocks)) extractedBlocks = json.blocks;
                    else if (Array.isArray(json)) extractedBlocks = json;
                    else if (json.story_string !== undefined) {
                        if (json.system_prompt) extractedBlocks.push({ name: 'System Prompt', identifier: 'system_prompt', content: json.system_prompt, role: 'system' });
                        if (json.story_string) extractedBlocks.push({ name: 'Story String', identifier: 'story_string', content: json.story_string, role: 'system' });
                        if (json.post_history_instructions) extractedBlocks.push({ name: 'Post History (PHI)', identifier: 'post_history', content: json.post_history_instructions, role: 'system' });
                    }

                    if (extractedBlocks.length === 0) {
                        showToast('⚠️ 未能从文件中识别出有效的预设规则块！');
                        return;
                    }

                    // 2. 格式化内部规则块（核心修复：优先取 b.name 真正的中文名字，identifier 多为 UUID 唯一码）
                    const formattedBlocks = extractedBlocks.map((b, index) => {
                        // 酒馆规范：name 是人类可读名称，identifier 往往是 UUID 唯一码 → 优先取 name
                        const rawName = b.name && String(b.name).trim() ? String(b.name).trim() : (b.identifier && String(b.identifier).trim() ? String(b.identifier).trim() : '');
                        const ruleDisplayName = safeDecode(rawName) || `规则块 ${index + 1}`;
                        return {
                            id: 'block_' + Date.now() + '_' + String(index).padStart(4, '0'),
                            identifier: ruleDisplayName,                    // 👈 正确赋值人类可读的 name
                            name: ruleDisplayName,                          // name 双写兼容旧渲染 / AI 编译
                            rawUUID: safeDecode(String(b.identifier || '')), // 保留底层的 UUID 标识
                            content: safeDecode(b.content || b.text) || '',
                            role: b.role || 'system',
                            enabled: b.enabled !== undefined ? b.enabled : true
                        };
                    });

                    // 3. 提取总条目名称（优先读取 JSON name，否则使用文件名，均套解码保护）
                    let rawFileName = file.name.replace(/\.[^/.]+$/, '').trim();
                    let masterName = safeDecode(rawFileName); // 🛡️ 给文件名套上解码保护
                    if (json.name) {
                        masterName = safeDecode(String(json.name).trim()); // 🛡️ 给 JSON 内部名称套上保护
                    }

                    // 防重名命名处理
                    let finalName = masterName || '未命名预设';
                    let count = 1;
                    while (presets.some(p => p.name === finalName)) {
                        finalName = `${masterName || '未命名预设'} (${count++})`;
                    }

                    // 4. 🌟 生成全新的"预设总条目"
                    const newMasterPreset = {
                        id: 'preset_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                        name: finalName,
                        blocks: formattedBlocks // 完整的子规则链
                    };

                    // 5. 存入总条目库，并自动切换选中当前新建的总条目
                    presets.push(newMasterPreset);
                    activePresetId = newMasterPreset.id;
                    syncPresetsToLegacy(); // 同步旧兼容层

                    saveToLocal();
                    renderPresetManager(); // 刷新 UI
                    renderDropdowns();
                    showToast(`✅ 已创建预设总条目：【${finalName}】（包含 ${formattedBlocks.length} 条子规则）`);

                } catch (err) {
                    console.error('预设导入失败:', err);
                    showToast('❌ 预设文件格式不正确或解析失败');
                }
            };

            reader.readAsText(file);
        }

        // 🎨 渲染预设管理面板（顶层为总条目选择）
        function renderPresetManager() {
            const container = document.getElementById('preset-blocks-container');
            if (!container) return;

            const optionsHTML = presets.map(p =>
                `<option value="${p.id}" ${p.id === activePresetId ? 'selected' : ''}>📦 ${escHtml(p.name)} (${(p.blocks || []).length} 条子规则)</option>`
            ).join('');

            const topBarHTML = `
                <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); margin-bottom: 14px;">

                    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
                        <select id="preset-profile-select" style="flex: 1; min-width: 200px; background: #1a1a1a; color: #8ecbff; border: 1px solid #444; border-radius: 4px; padding: 7px 10px; font-size: 13px; font-weight: bold;" onchange="switchPresetProfile(this.value)">

                        </select>
                        <div style="display: flex; gap: 6px; flex-wrap: wrap;">

                            <button onclick="renameCurrentPresetProfile()" style="background: #3a3a3a; color: #ddd; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer;">✏️ 改名</button>
                            <button onclick="deleteCurrentPresetProfile()" style="background: #8b2626; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer;">🗑️ 删除总条目</button>
                            <button onclick="exportPresetProfile()" style="background: #3a5a2b; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer;">📤 导出当前</button>

            } else {

                    <div class="preset-block-card" style="background: #242424; border: 1px solid #333; border-radius: 6px; padding: 10px; margin-bottom: 8px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 4px;">
                            <span style="display:flex; align-items:center; gap:6px; min-width:0;">
                                <button type="button" onclick="togglePresetBlockExpand(${idx}, this)" title="展开/收起内容" style="flex:0 0 auto; background:#333;color:#aaa;border:none;padding:2px 8px;border-radius:3px;font-size:12px;cursor:pointer;">▸</button>
                                <span style="font-size: 12px; color: #aaa; font-weight: bold;">#${idx + 1} ${escHtml(b.identifier || b.name || '未命名规则')}</span>
                            </span>
                            <span style="display:flex; gap:6px; align-items:center;">
                                <label style="font-size: 12px; color: #8ecbff; cursor: pointer;">
                                    <input type="checkbox" ${b.enabled ? 'checked' : ''} onchange="togglePresetBlockEnabled(${idx}, this.checked)"> 启用
                                </label>
                                <button onclick="movePresetBlock(${idx}, -1)" style="background:#333;color:#aaa;border:none;padding:2px 8px;border-radius:3px;font-size:12px;cursor:pointer;" title="上移">▲</button>
                                <button onclick="movePresetBlock(${idx}, 1)" style="background:#333;color:#aaa;border:none;padding:2px 8px;border-radius:3px;font-size:12px;cursor:pointer;" title="下移">▼</button>
                                <button onclick="removePresetBlock(${idx})" style="background:#8b2626;color:white;border:none;padding:2px 8px;border-radius:3px;font-size:12px;cursor:pointer;" title="删除该子规则">🗑️</button>
                            </span>
                        </div>
                        <div class="preset-block-body" data-preset-block-body="${idx}" style="display:none;">
                            <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center;">
                                <select style="flex:0 0 90px; background:#181818;color:#ddd;border:1px solid #383838;border-radius:4px;font-size:12px;padding:3px;" onchange="updatePresetBlockField(${idx}, 'role', this.value)">
                                    <option value="system" ${String(b.role || 'system') === 'system' ? 'selected' : ''}>system</option>
                                    <option value="user" ${String(b.role || '') === 'user' ? 'selected' : ''}>user</option>
                                </select>
                                <input value="${escAttr(b.identifier || b.name || '')}" placeholder="规则名称" style="flex:1; background:#181818;color:#ddd;border:1px solid #383838;border-radius:4px;font-size:12px;padding:3px 6px;" onchange="updatePresetBlockField(${idx}, 'name', this.value);updatePresetBlockField(${idx}, 'identifier', this.value)" />
                            </div>
                            <textarea style="width: 100%; height: 60px; background: #181818; color: #ddd; border: 1px solid #383838; border-radius: 4px; font-size: 12px; padding: 6px; box-sizing: border-box; resize: vertical;" onchange="updatePresetBlockField(${idx}, 'content', this.value)">${escHtml(b.content || '')}</textarea>
                        </div>
                    </div>
                `).join('');
            }

            container.innerHTML = topBarHTML + blocksHTML;
        }

        // ▸ 展开/收起子规则内容
        function togglePresetBlockExpand(idx, btn) {
            const container = document.getElementById('preset-blocks-container');
            if (!container || !btn) return;
            const body = container.querySelector(`[data-preset-block-body="${idx}"]`);
            if (!body) return;
            const expanded = body.style.display !== 'none';
            body.style.display = expanded ? 'none' : '';
            btn.textContent = expanded ? '▸' : '▾';
            btn.title = expanded ? '展开内容' : '收起内容';
        }

        // 切换当前激活的预设总条目
        function switchPresetProfile(presetId) {
            if (presets.some(p => p.id === presetId)) {
                activePresetId = presetId;
                currentPromptId = presetId;
                syncPresetsToLegacy();
                saveToLocal();
                renderDropdowns();
                renderPresetManager();
                const active = getActivePreset();
                showToast(`已切换至总条目：【${active.name}】`);
            }
        }

        // 新建空白预设总条目
        function createNewPresetProfile() {
            const name = prompt('请输入新预设总条目的名称：', '手动新建预设总条目');
            if (!name || !name.trim()) return;

            const newPreset = {
                id: 'preset_' + Date.now(),
                name: name.trim(),
                blocks: []
            };
            presets.push(newPreset);
            activePresetId = newPreset.id;
            currentPromptId = newPreset.id;
            syncPresetsToLegacy();
            saveToLocal();
            renderDropdowns();
            renderPresetManager();
            showToast(`已新建预设总条目：【${newPreset.name}】`);
        }

        // 重命名当前选中的总条目
        function renameCurrentPresetProfile() {
            const active = getActivePreset();
            const newName = prompt('重命名当前预设总条目：', active.name);
            if (!newName || !newName.trim() || newName === active.name) return;

            active.name = newName.trim();
            syncPresetsToLegacy();
            saveToLocal();
            renderDropdowns();
            renderPresetManager();
            showToast(`已更名为：【${active.name}】`);
        }

        // 删除当前总条目
        function deleteCurrentPresetProfile() {
            if (presets.length <= 1) {
                showToast('⚠️ 至少需要保留一个预设总条目！');
                return;
            }
            const active = getActivePreset();
            if (confirm(`确定要彻底删除预设总条目【${active.name}】及其内部所有的规则块吗？`)) {
                presets = presets.filter(p => p.id !== active.id);
                activePresetId = presets[0].id;
                currentPromptId = activePresetId;
                syncPresetsToLegacy();
                saveToLocal();
                renderDropdowns();
                renderPresetManager();
                showToast(`已彻底删除总条目：【${active.name}】`);
            }
        }

        // 按 id 删除总条目（供列表等调用）
        function deletePresetProfileById(id) {
            const target = presets.find(p => p.id === id);
            if (!target) return;
            if (!confirm(`确定删除预设总条目【${target.name}】吗？`)) return;
            presets = presets.filter(p => p.id !== id);
            if (activePresetId === id) {
                activePresetId = presets.length ? presets[0].id : null;
                currentPromptId = activePresetId;
            }
            syncPresetsToLegacy();
            saveToLocal();
            renderDropdowns();
            renderPresetManager();
        }

        // 子规则：启用开关
        function togglePresetBlockEnabled(idx, checked) {
            const active = getActivePreset();
            if (!active.blocks || !active.blocks[idx]) return;
            active.blocks[idx].enabled = !!checked;
            syncPresetsToLegacy();
            saveToLocal();
        }

        // 子规则：更新字段
        function updatePresetBlockField(idx, field, value) {
            const active = getActivePreset();
            if (!active.blocks || !active.blocks[idx]) return;
            active.blocks[idx][field] = value;
            syncPresetsToLegacy();
            saveToLocal();
        }

        // 子规则：删除
        function removePresetBlock(idx) {
            const active = getActivePreset();
            if (!active.blocks) return;
            active.blocks.splice(idx, 1);
            syncPresetsToLegacy();
            saveToLocal();
            renderPresetManager();
        }

        // 子规则：上移/下移
        function movePresetBlock(idx, dir) {
            const active = getActivePreset();
            if (!active.blocks) return;
            const to = idx + dir;
            if (to < 0 || to >= active.blocks.length) return;
            const tmp = active.blocks[idx];
            active.blocks[idx] = active.blocks[to];
            active.blocks[to] = tmp;
            syncPresetsToLegacy();
            saveToLocal();
            renderPresetManager();
        }

        // 📤 导出当前激活总条目为 JSON（SillyTavern 兼容格式）
        function exportPresetProfile() {
            const active = getActivePreset();
            const exportData = {
                name: active.name,
                prompts: (active.blocks || []).map(b => ({
                    name: b.identifier || b.name || '规则块',
                    content: b.content || '',
                    role: b.role || 'system',
                    enabled: b.enabled !== undefined ? b.enabled : true
                }))
            };
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = (active.name || '预设').replace(/[\\/:*?"<>|]/g, '_') + '.json';
            a.click();
            URL.revokeObjectURL(a.href);
            showToast(`已导出总条目：【${active.name}】`);
        }

        // 编译当前激活总条目中已开启的规则（AI 上下文拼接）
        function compilePresetMessages() {
            const activeMaster = getActivePreset();
            const enabledBlocks = (activeMaster.blocks || []).filter(b => b.enabled);
            return enabledBlocks.map(b => ({
                role: b.role || 'system',
                content: b.content || ''
            }));
        }

        // ============================================================
        //  块编辑器：编辑当前预设的 blocks（SillyTavern 风格）
        // ============================================================
        let editingBlocks = null; // 当前正在编辑的 blocks 工作副本

        function escHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function escAttr(s) { return escHtml(s).replace(/"/g, '&quot;'); }

        // 载入当前预设的 blocks 工作副本
        function initBlockEditor() {
            const preset = promptPresets[currentPromptId];
            if (!preset) { editingBlocks = []; return; }
            if (!Array.isArray(preset.blocks)) preset.blocks = [];
            editingBlocks = JSON.parse(JSON.stringify(preset.blocks));
        }

        // 🚀 修复二：textarea 高度自适应（用 requestAnimationFrame 打散布局压力，防 Layout Thrashing）
        function autoResize(el) {
            if (!el) return;
            let done = false;
            const doResize = () => {
                if (done) return;
                done = true;
                el.style.height = 'auto'; // 先归零
                el.style.height = el.scrollHeight + 'px'; // 再根据实际内容撑开
            };
            // 优先利用浏览器帧渲染机制打散布局压力
            if (typeof requestAnimationFrame === 'function') {
                requestAnimationFrame(doResize);
                // 兜底：若 rAF 被节流（后台标签页/忙碌），150ms 后强制生效，保证高度最终被撑开
                setTimeout(doResize, 150);
            } else {
                doResize();
            }
        }

        // 渲染块编辑区
        function renderBlockEditor() {
            const container = document.getElementById('blockEditorContainer');
            if (!container) return;
            const preset = promptPresets[currentPromptId];
            if (!preset) { container.innerHTML = ''; return; }
            if (!editingBlocks) initBlockEditor();

            container.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <span style="font-weight:500; font-size:13px; color:var(--text-secondary);">📝 编辑「${escHtml(preset.name)}」的区块 (${editingBlocks.length})</span>
                    <span style="display:flex; gap:4px;">
                        <button class="btn btn-sm" type="button" onclick="exportPromptPreset('${escAttr(currentPromptId)}')" title="导出当前预设">📤 导出</button>
                        <button class="btn btn-sm" type="button" onclick="addPromptBlock()">➕ 添加区块</button>
                    </span>
                </div>
                ${editingBlocks.map((b, i) => `
                    <div style="background:var(--bg-elevated);border:1px solid var(--border-color);border-radius:6px;padding:8px 10px;margin-bottom:6px;">
                        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                            <button class="btn btn-sm" type="button" onclick="togglePromptBlockExpand(${i}, this)" title="展开/收起内容" style="flex:0 0 auto; padding:0 6px; line-height:1;">▸</button>
                            <label style="display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-secondary); cursor:pointer; white-space:nowrap;">
                                <input type="checkbox" style="width:auto;" ${b.enabled ? 'checked' : ''} onchange="updatePromptBlock(${i}, 'enabled', this.checked)" />
                                启用
                            </label>
                            <select class="select-styled" style="flex:0 0 88px; font-size:12px; padding:2px 6px;" onchange="updatePromptBlock(${i}, 'role', this.value)">
                                <option value="system" ${String(b.role || '').toLowerCase() === 'system' ? 'selected' : ''}>system</option>
                                <option value="user" ${String(b.role || '').toLowerCase() === 'user' ? 'selected' : ''}>user</option>
                            </select>
                            <input value="${escAttr(b.name)}" placeholder="区块名称" style="flex:1; min-width:90px; background:var(--bg-input);border:1px solid var(--border-color);border-radius:4px;padding:3px 6px;font-size:12px;color:var(--text-primary);" onchange="updatePromptBlock(${i}, 'name', this.value)" />
                            <span style="display:flex; gap:2px;">
                                <button class="btn btn-sm" type="button" onclick="movePromptBlock(${i}, -1)" title="上移">↑</button>
                                <button class="btn btn-sm" type="button" onclick="movePromptBlock(${i}, 1)" title="下移">↓</button>
                                <button class="btn btn-sm btn-danger" type="button" onclick="removePromptBlock(${i})" title="删除区块">🗑️</button>
                            </span>
                        </div>
                        <div class="block-body" data-block-body="${i}" style="display:none;">
                            <textarea placeholder="区块内容..." rows="2" style="width:100%; margin-top:6px; background:var(--bg-input);border:1px solid var(--border-color);border-radius:4px;padding:6px 8px;font-size:12px;color:var(--text-primary);font-family:inherit;line-height:1.5;resize:none;" oninput="autoResize(this);updatePromptBlock(${i}, 'content', this.value)">${escHtml(b.content)}</textarea>
                        </div>
                    </div>
                `).join('') || '<div class="text-muted text-sm" style="padding:8px;">该预设暂无区块，点击"➕ 添加区块"开始。</div>'}
                <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:8px;">
                    <button class="btn btn-primary btn-sm" type="button" onclick="savePromptBlocks()">💾 保存修改</button>
                    <button class="btn btn-sm" type="button" onclick="initBlockEditor();renderBlockEditor();">↩️ 放弃修改</button>
                </div>
            `;

            // 🚀 修复一：延迟触发高度自适应，防止大量 textarea 同时读 scrollHeight 造成强制同步布局卡顿
            // 只对可见（未收起）的文本域自适应，收起区块的内容留待展开时再撑开
            setTimeout(() => {
                container.querySelectorAll('textarea').forEach(ta => {
                    if (ta.offsetParent !== null) autoResize(ta);
                });
            }, 50);
        }

        function updatePromptBlock(index, field, value) {
            if (editingBlocks && editingBlocks[index]) { editingBlocks[index][field] = value; }
        }

        // 🚀 新增：下拉三角控制展开/收起区块内容（默认收起，避免全部内容堆叠展示）
        function togglePromptBlockExpand(index, btn) {
            const container = document.getElementById('blockEditorContainer');
            if (!container || !btn) return;
            const body = container.querySelector(`[data-block-body="${index}"]`);
            if (!body) return;
            const expanded = body.style.display !== 'none';
            body.style.display = expanded ? 'none' : '';
            btn.textContent = expanded ? '▸' : '▾';
            btn.title = expanded ? '展开内容' : '收起内容';
            // 展开后让文本域自适应高度
            if (!expanded) {
                const ta = body.querySelector('textarea');
                if (ta) autoResize(ta);
            }
        }
        function addPromptBlock() {
            if (!editingBlocks) initBlockEditor();
            editingBlocks.push({ uid: Date.now(), name: `新区块 ${editingBlocks.length + 1}`, role: 'system', enabled: true, content: '' });
            renderBlockEditor();
        }
        function removePromptBlock(index) {
            if (!editingBlocks) return;
            editingBlocks.splice(index, 1);
            renderBlockEditor();
        }
        function movePromptBlock(index, dir) {
            if (!editingBlocks) return;
            const target = index + dir;
            if (target < 0 || target >= editingBlocks.length) return;
            const t = editingBlocks[index];
            editingBlocks[index] = editingBlocks[target];
            editingBlocks[target] = t;
            renderBlockEditor();
        }
        function savePromptBlocks() {
            const preset = promptPresets[currentPromptId];
            if (!preset) return;
            let blocks = JSON.parse(JSON.stringify(editingBlocks || []));
            if (blocks.length === 0) {
                // 至少保留一个有效块，避免完全为空
                blocks = [{ uid: Date.now(), name: '系统指令', role: 'system', enabled: true, content: '' }];
            }
            preset.blocks = blocks;
            editingBlocks = JSON.parse(JSON.stringify(blocks));
            saveToLocal();
            renderDropdowns();
            showToast(`已保存预设「${preset.name}」的 ${blocks.length} 个区块`);
            renderBlockEditor();
        }

        // 导出指定预设为 SillyTavern 兼容 JSON
        function exportPromptPreset(id) {
            const preset = promptPresets[id];
            if (!preset) return;
            try {
                // 🚀 核心修复：完整打包，包含 system_prompt 等全局设定
                const data = {
                    name: preset.name || id,
                    system_prompt: preset.system_prompt || '',
                    input_sequence: preset.input_sequence || '',
                    output_sequence: preset.output_sequence || '',
                    blocks: (Array.isArray(preset.blocks) ? preset.blocks : []).map(b => ({
                        name: b.name,
                        role: b.role,
                        content: b.content,
                        enabled: b.enabled
                    }))
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'preset_' + (data.name || id).replace(/[\\/:*?"<>|]/g, '_') + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                showToast('预设导出成功');
            } catch (err) {
                console.error('导出预设失败:', err);
                alert('导出失败: ' + err.message);
            }
        }

        // ============================================================
        //  多模块预设 Prompt 组装引擎
        // ============================================================
        /**
         * 将已勾选启用的 Blocks 编译为符合 API 规范的 Context 数组
         * @param {Array} blocks 预设规则块列表
         * @param {string} userMessage 末尾追加的用户消息（对话/指令）
         * @param {string} currentWorldbookContext 注入到 {{worldbook}} 占位符的全局动态上下文
         */
        function assemblePresetMessages(blocks, userMessage = '', currentWorldbookContext = '') {
            if (!blocks || !Array.isArray(blocks)) return [];

            // 1. 过滤已启用的模块并按 Order 升序排序
            const activeBlocks = blocks
                .filter(b => b.enabled)
                .sort((a, b) => (a.order || 0) - (b.order || 0));

            let assembledMessages = [];
            let systemContentBuffer = [];

            activeBlocks.forEach(block => {
                let content = block.content || '';

                // 注入全局动态上下文（如果区块涉及世界书变量，可在此替换）
                content = content.replace(/\{\{worldbook\}\}/g, currentWorldbookContext);

                if (block.role === 'system') {
                    systemContentBuffer.push(content);
                } else {
                    // 如果之前有积攒的 System 内容，先打包推入
                    if (systemContentBuffer.length > 0) {
                        assembledMessages.push({ role: 'system', content: systemContentBuffer.join('\n\n') });
                        systemContentBuffer = [];
                    }
                    assembledMessages.push({ role: block.role, content: content });
                }
            });

            // 追加剩余的 System 缓冲区
            if (systemContentBuffer.length > 0) {
                assembledMessages.push({ role: 'system', content: systemContentBuffer.join('\n\n') });
            }

            // 末尾追加当前用户发送的对话或指令
            if (userMessage) {
                assembledMessages.push({ role: 'user', content: userMessage });
            }

            return assembledMessages;
        }

        /**
         * 组装已勾选酒馆预设 + 当前上下文的 API 消息序列
         * @param {Array} presetBlocks 预设规则块列表
         * @param {string} baseInstruction 基础系统任务指令（如"你是世界书架构师"）
         * @param {string} worldbookContext 世界书上下文（注入 {{worldbook}}/{{lore}}）
         * @param {string} extraUserPrompt 用户当前的改写/生成要求
         */
        function assemblePresetMessagesForAI(presetBlocks, baseInstruction = '', worldbookContext = '', extraUserPrompt = '') {
            // 1. 获取所有开启的区块并按 order 排序
            const activeBlocks = (presetBlocks || [])
                .filter(b => b.enabled)
                .sort((a, b) => (a.order || 0) - (b.order || 0));

            let apiMessages = [];
            let systemBuffer = [];

            // 基础系统任务指令（如：你是一个专业的酒馆世界书架构师）
            if (baseInstruction.trim()) {
                systemBuffer.push(baseInstruction.trim());
            }

            // 2. 依次注入酒馆预设块
            activeBlocks.forEach(block => {
                let content = block.content || '';

                // 替换酒馆标准宏表达式
                content = content
                    .replace(/\{\{char\}\}/gi, 'AI')
                    .replace(/\{\{user\}\}/gi, 'User')
                    .replace(/\{\{worldbook\}\}/gi, worldbookContext)
                    .replace(/\{\{lore\}\}/gi, worldbookContext);

                if (block.role === 'system') {
                    systemBuffer.push(`【预设规则: ${block.name}】\n${content}`);
                } else {
                    // 遇到了非 system 块，先将前面积攒的 systemBuffer 打包归入消息序列
                    if (systemBuffer.length > 0) {
                        apiMessages.push({ role: 'system', content: systemBuffer.join('\n\n') });
                        systemBuffer = [];
                    }
                    apiMessages.push({ role: block.role, content: content });
                }
            });

            // 刷出剩余的 systemBuffer
            if (systemBuffer.length > 0) {
                apiMessages.push({ role: 'system', content: systemBuffer.join('\n\n') });
            }

            // 3. 注入用户当前的改写/生成要求
            if (extraUserPrompt.trim()) {
                apiMessages.push({ role: 'user', content: extraUserPrompt.trim() });
            }

            return apiMessages;
        }

        /**
         * 在 AI 帮写/扩写世界书条目时应用酒馆预设（预编译消息直接接驳 fetchAICompletion）
         */
        async function generateEntryWithPreset(userPrompt, currentEntryContext = '') {
            // 获取当前生效的酒馆预设 Blocks（现有架构：promptPresets[currentPromptId]）
            const currentPreset = promptPresets[currentPromptId];
            const currentPresetBlocks = (currentPreset && Array.isArray(currentPreset.blocks)) ? currentPreset.blocks : [];

            const baseSystemTask = `你是一名精通 SillyTavern（酒馆）引擎的世界书创作大师。请严格按照预设规则与格式要求，创作或优化以下世界书条目。`;

            // 💡 自动编译：将“预设规则”与“创作需求”完美融合
            const messages = assemblePresetMessagesForAI(
                currentPresetBlocks,
                baseSystemTask,
                currentEntryContext, // 当前世界书上下文
                userPrompt           // 用户的要求，如："请扩写一个关于工业帝国兵工厂的条目"
            );

            // 发送给 API（fetchAICompletion 已支持直接接收预编译的 messages 数组）
            const response = await fetchAICompletion(messages);
            return response;
        }
