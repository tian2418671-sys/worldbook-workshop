<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界书工坊 · AI 驱动</title>
    <style>

        /* 🎨 标签徽章基准样式 */
        .tag-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.2;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #e2e8f0;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        /* 原生 5 大分类的经典配色 */
        .tag-chip.cat-char   { background: rgba(59, 130, 246, 0.25); border-color: rgba(59, 130, 246, 0.5); color: #93c5fd; }
        .tag-chip.cat-loc    { background: rgba(16, 185, 129, 0.25); border-color: rgba(16, 185, 129, 0.5); color: #6ee7b7; }
        .tag-chip.cat-item   { background: rgba(245, 158, 11, 0.25); border-color: rgba(245, 158, 11, 0.5); color: #fde047; }
        .tag-chip.cat-org    { background: rgba(168, 85, 247, 0.25); border-color: rgba(168, 85, 247, 0.5); color: #d8b4fe; }
        .tag-chip.cat-event  { background: rgba(236, 72, 153, 0.25); border-color: rgba(236, 72, 153, 0.5); color: #fbcfe8; }
        /* 兼容旧数据残留的 cat-custom（自定义标签现走内联动态色，此兜底无害） */
        .tag-chip.cat-custom { background: rgba(99, 102, 241, 0.25); border-color: rgba(99, 102, 241, 0.5); color: #a5b4fc; }

        .tag-chip .remove-btn {
            margin-left: 4px;
            cursor: pointer;
            color: #f87171;
            font-weight: bold;
            font-size: 13px;
            line-height: 1;
            opacity: 0.8;
        }
        .tag-chip .remove-btn:hover { opacity: 1; color: #ef4444; }

        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-base: #0f0e12;
            --bg-surface: #1a1920;
            --bg-elevated: #26242e;
            --bg-input: #2d2b36;
            --border-color: #3a3645;
            --text-primary: #e8e6ed;
            --text-secondary: #a9a5b8;
            --text-muted: #736f84;
            --accent: #b48aff;
            --accent-dim: #7f6bb0;
            --green: #7fe0b0;
            --red: #f28b82;
            --yellow: #f9d77e;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            --radius: 10px;
            --transition: 0.2s ease;
        }

        /* ☀️ 亮色主题变量覆盖 */
        [data-theme="light"] {
            --bg-base: #f5f3f0;
            --bg-surface: #faf9f7;
            --bg-elevated: #ffffff;
            --bg-input: #f0ede8;
            --border-color: #d4cfc4;
            --text-primary: #1a1814;
            --text-secondary: #5c5548;
            --text-muted: #968c7a;
            --accent: #6b4bc4;
            --accent-dim: #8b6fd4;
            --green: #2d8a5e;
            --red: #c0392b;
            --yellow: #b8860b;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        /* ===== 通用按钮 ===== */
        .btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--bg-input);
            color: var(--text-primary);
            border-color: var(--accent-dim);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #0f0e12;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: var(--accent-dim);
            border-color: var(--accent-dim);
            color: #fff;
        }

        .btn-success {
            background: var(--green);
            border-color: var(--green);
            color: #0f0e12;
        }

        .btn-success:hover {
            opacity: 0.8;
        }

        .btn-danger {
            background: var(--red);
            border-color: var(--red);
            color: #0f0e12;
        }

        .btn-danger:hover {
            opacity: 0.8;
        }

        .btn-sm {
            padding: 3px 8px;
            font-size: 12px;
        }

        .badge {
            background: var(--bg-elevated);
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 11px;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        /* ===== 顶部导航 ===== */
        .navbar {
            display: flex;
            align-items: center;
            align-content: center;
            justify-content: space-between;
            padding: 8px 20px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 52px;
            /* 允许内容换行时自然增高，避免按钮被裁切/遮盖 */
            flex-wrap: wrap;
            gap: 6px;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-left .logo {
            background: var(--accent);
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f0e12;
            font-weight: 700;
            font-size: 16px;
        }

        .workspace-name {
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid transparent;
        }

        .workspace-name:hover {
            border-color: var(--border-color);
        }

        .navbar-center {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .select-styled {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 4px 8px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .select-styled:focus {
            border-color: var(--accent);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
        }

        .icon-btn:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        /* ===== 主体布局 ===== */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== 左侧栏 ===== */
        .sidebar-left {
            width: 220px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            padding: 12px 10px;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-left .section-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            padding: 4px 6px;
        }

        .worldbook-item {
            padding: 8px 10px;
            border-radius: 6px;
            background: var(--bg-elevated);
            border: 1px solid transparent;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .worldbook-item:hover {
            background: var(--bg-input);
            border-color: var(--border-color);
        }

        .worldbook-item.active {
            border-color: var(--accent);
            background: var(--bg-input);
        }

        .worldbook-item .name {
            font-weight: 500;
            font-size: 13px;
        }

        .worldbook-item .meta {
            font-size: 10px;
            color: var(--text-muted);
        }

        .worldbook-item .actions {
            display: flex;
            gap: 2px;
        }

        .worldbook-item .actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 0 3px;
            border-radius: 4px;
        }

        .worldbook-item .actions button:hover {
            background: var(--bg-base);
            color: var(--text-primary);
        }

        .worldbook-item.drop-target {
            border-color: var(--accent);
            background: rgba(122, 92, 255, 0.12);
            box-shadow: 0 0 0 2px var(--accent);
        }

        /* ===== 中间栏 ===== */
        .sidebar-middle {
            width: 280px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            padding: 12px 10px;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toolbar {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 10px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            min-width: 60px;
        }

        .toolbar input::placeholder {
            color: var(--text-muted);
        }

        .toolbar input:focus {
            border-color: var(--accent);
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* ===== 分类筛选栏样式 ===== */
        .tag-filter-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            padding: 0 2px;
        }

        .tag-filter-label {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .tag-filter-select {
            flex: 1;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .tag-filter-select:hover, .tag-filter-select:focus {
            border-color: var(--accent);
        }

        .model-chip {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            -webkit-user-select: none;
            user-select: none;
        }
        .model-chip:hover {
            background: var(--accent);
            color: #0f0e12;
            border-color: var(--accent);
        }

        .entry-item {
            padding: 8px 10px;
            border-radius: 6px;
            background: var(--bg-elevated);
            border: 1px solid transparent;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .entry-item:hover {
            background: var(--bg-input);
        }

        .entry-item.active {
            border-color: var(--accent);
            background: var(--bg-input);
        }

        .entry-item .info {
            display: flex;
            flex-direction: column;
            gap: 1px;
            overflow: hidden;
        }

        .entry-item .info .title {
            font-weight: 500;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .entry-item .info .keys {
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .entry-item .info .tag {
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 3px;
            margin-right: 4px;
            font-weight: 600;
            display: inline-block;
            vertical-align: middle;
        }

        .tag-char { background: rgba(242, 139, 130, 0.2); color: var(--red); border: 1px solid rgba(242, 139, 130, 0.3); } /* 人物/角色 */
        .tag-loc { background: rgba(127, 224, 176, 0.2); color: var(--green); border: 1px solid rgba(127, 224, 176, 0.3); } /* 地点/场景 */
        .tag-item { background: rgba(249, 215, 126, 0.2); color: var(--yellow); border: 1px solid rgba(249, 215, 126, 0.3); } /* 物品/神器 */
        .tag-org { background: rgba(180, 138, 255, 0.2); color: var(--accent); border: 1px solid rgba(180, 138, 255, 0.3); } /* 阵营/组织 */
        .tag-event { background: rgba(169, 165, 184, 0.2); color: var(--text-secondary); border: 1px solid rgba(169, 165, 184, 0.3); } /* 事件/历史 */

        .entry-item .status {
            display: flex;
            gap: 4px;
            align-items: center;
            font-size: 11px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.green {
            background: var(--green);
        }

        .status-dot.blue {
            background: var(--accent);
        }

        .status-dot.yellow {
            background: var(--yellow);
        }

        /* ===== 右侧编辑区 ===== */
        .editor-panel {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            background: var(--bg-base);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .editor-panel .empty-state {
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 10px;
        }

        .editor-panel .empty-state .icon {
            font-size: 40px;
            opacity: 0.3;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .editor-header .title-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border-color);
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            padding: 2px 0;
            outline: none;
            min-width: 150px;
            flex: 1;
        }

        .editor-header .title-input:focus {
            border-bottom-color: var(--accent);
        }

        .editor-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .editor-meta {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
            background: var(--bg-surface);
            padding: 10px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }

        .editor-meta .field {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .editor-meta .field label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .editor-meta .field input,
        .editor-meta .field select {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 2px 6px;
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
        }

        .editor-meta .field input:focus,
        .editor-meta .field select:focus {
            border-color: var(--accent);
        }

        /* 🆕 折叠分类式编辑器：通用输入控件与卡片样式 */
        .input-styled {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            box-sizing: border-box;
        }
        .input-styled:focus { border-color: var(--accent); }
        .editor-meta > div > div label,
        .editor-meta details label {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }
        .editor-meta select.select-styled { width: 100%; box-sizing: border-box; }
        .editor-meta details summary { font-size: 13px; }

        .editor-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .editor-content .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-content textarea {
            /* 注意：不能设 flex:1 —— flex-basis:0% 会覆盖 height 并禁用浏览器 resize 手柄 */
            flex: none;
            min-height: 160px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 13px;
            line-height: 1.6;
            resize: vertical; /* 📝 解锁垂直拖拽缩放 */
            outline: none;
            font-family: inherit;
        }

        /* 📝 解锁内容文本框的拖拽缩放能力 */
        #contentTextarea {
            resize: vertical !important; /* 核心：允许用户垂直拖拽改变高度 */
            min-height: 200px;           /* 合理的最小高度，防止缩得太小 */
            max-height: 80vh;            /* 最大高度为屏幕高度 80%，防止撑爆页面 */
            overflow-y: auto;            /* 内容超出时正常显示滚动条 */
            width: 100%;
            box-sizing: border-box;
        }

        .editor-content textarea:focus {
            border-color: var(--accent);
        }

        .editor-footer {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            padding-top: 4px;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            max-width: 700px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .modal .modal-body {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .modal .modal-body textarea,
        .modal .modal-body input,
        .modal .modal-body select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 10px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            font-family: inherit;
            margin-top: 4px;
        }

        .modal .modal-body textarea {
            min-height: 100px;
            resize: vertical;
        }

        .modal .modal-body input:focus,
        .modal .modal-body select:focus,
        .modal .modal-body textarea:focus {
            border-color: var(--accent);
        }

        .modal .modal-body .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .modal .modal-body .row>* {
            flex: 1;
            min-width: 120px;
        }

        .modal .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .log-entry {
            padding: 6px 10px;
            background: var(--bg-elevated);
            border-radius: 6px;
            border-left: 3px solid var(--border-color);
            margin-bottom: 6px;
            font-size: 13px;
        }

        .log-entry.success {
            border-left-color: var(--green);
        }

        .log-entry.fail {
            border-left-color: var(--red);
        }

        .log-entry .time {
            color: var(--text-muted);
            font-size: 11px;
        }

        .log-entry .detail {
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 2px;
            word-break: break-all;
        }

        /* ===== AI 运行状态指示器 ===== */
        #aiStatusIndicator {
            display: none;
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #0f0e12;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            z-index: 9999;
            box-shadow: var(--shadow);
            align-items: center;
            gap: 6px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .spinner-icon {
            display: inline-block;
            animation: spin 1.5s linear infinite;
        }

        /* ===== 响应式优化 ===== */
        @media (max-width: 1024px) {

            /* 平板横屏：稍微收窄侧边栏 */
            .sidebar-left {
                width: 180px;
            }

            .sidebar-middle {
                width: 220px;
            }
        }

        @media (max-width: 768px) {

            /* 手机/平板竖屏：转为流式滚动布局 */
            body {
                height: auto;
                overflow-y: auto;
                /* 允许整页自然滚动 */
            }

        // 真正的写入核心（保持原有完整打包写入逻辑）
        function _saveToLocalCore() {
            try {
                const data = buildSaveData();
                // 🚀 撤回机制：每次保存前，把"上一次已保存状态"记为撤销目标（始终指向最近一次修改前）
                if (lastSavedData !== null) {
                    try { undoSnapshot = JSON.parse(JSON.stringify(lastSavedData)); } catch (e2) { undoSnapshot = null; }
                }
                try { lastSavedData = JSON.parse(JSON.stringify(data)); } catch (e3) {}
                // 🚀 核心升级：优先使用 IndexedDB（localforage）非阻塞保存，超大容量不卡顿
                if (typeof localforage !== 'undefined') {
                    localforage.setItem(IDB_KEY, data).catch(err => {
                        console.error('IndexedDB 保存失败:', err);
                        // 极端情况下的降级容灾
                        try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e2) {}
                    });
                } else {
                    // CDN 未加载/断网：降级回旧版 LocalStorage
                    try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e2) {}
                }
            } catch (e) {
                console.error('数据打包失败:', e);
            }
        }

            if (!confirm('确定要撤回上一次的修改内容吗？当前更改将被覆盖。')) return;
            try {

                if (undoSnapshot.worldbooks) worldbooks = undoSnapshot.worldbooks;

                if (undoSnapshot.promptPresets) promptPresets = undoSnapshot.promptPresets;
                if (undoSnapshot.currentPromptId) currentPromptId = undoSnapshot.currentPromptId;
                // 撤回后回填总条目库（presets 为新权威数据源）
                if (undoSnapshot.presets) { presets = undoSnapshot.presets; }
                if (undoSnapshot.activePresetId) activePresetId = undoSnapshot.activePresetId;
                syncLegacyToPresets();
                if (undoSnapshot.apiConfigs) apiConfigs = undoSnapshot.apiConfigs;
                if (undoSnapshot.currentApiId) currentApiId = undoSnapshot.currentApiId;
                if (undoSnapshot.apiLogs) apiLogs = undoSnapshot.apiLogs;
                if (Array.isArray(undoSnapshot.chatConversations)) {
                    chatConversations = undoSnapshot.chatConversations;
                    currentChatId = undoSnapshot.currentChatId || (chatConversations.length ? chatConversations[0].id : null);
                    const curConv = chatConversations.find(c => c.id === currentChatId);
                    chatMessages = curConv ? curConv.messages : [];
                }
                if (undoSnapshot.chatRules) chatRules = undoSnapshot.chatRules;
                if (Array.isArray(undoSnapshot.knowledgeDatabase)) knowledgeDatabase = undoSnapshot.knowledgeDatabase;
                if (undoSnapshot.currentLearnedFormat) window.currentLearnedFormat = undoSnapshot.currentLearnedFormat;
                if (typeof undoSnapshot.chatUsePreset === 'boolean') chatUsePreset = undoSnapshot.chatUsePreset;
                if (typeof undoSnapshot.entrySortMode !== 'undefined') entrySortMode = undoSnapshot.entrySortMode;

                // 撤回后的状态作为新的"上一次保存"基线，并清空撤销点（一次性撤回）
                lastSavedData = undoSnapshot;
                undoSnapshot = null;

                saveToLocal();

                if (p && typeof p === 'object' && !Array.isArray(p.blocks) && (p.system !== undefined || p.user !== undefined)) {
                    promptPresets[id] = {
                        name: p.name || id,
                        blocks: [

                            { uid: 2, name: '用户模板', role: 'user', enabled: true, content: p.user || '' }

                    };

            });

        // ============================================================
        //  AI 网络请求与拉取模型函数
        // ============================================================
        // 带超时与重试的 fetch 封装（仅对超时/网络错误重试）
        async function fetchWithRetry(url, options, { timeoutMs = 60000, retries = 2, backoffMs = 1500 } = {}) {
            let lastErr;
            for (let attempt = 0; attempt <= retries; attempt++) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    const res = await fetch(url, { ...options, signal: controller.signal });
                    clearTimeout(timer);
                    // 🚀 HTTP 429（限流）或 5xx（服务端故障）：指数退避重试
                    if ((res.status === 429 || res.status >= 500) && attempt < retries) {
                        const delay = backoffMs * Math.pow(2, attempt);
                        showToast(`服务器繁忙 (${res.status})，${(delay/1000).toFixed(1)}s 后自动重试...`);
                        await new Promise(r => setTimeout(r, delay));
                        continue;
                    }
                    return res;
                } catch (err) {
                    clearTimeout(timer);
                    lastErr = err;
                    const retriable = err.name === 'AbortError' || err instanceof TypeError;
                    if (attempt < retries && retriable) {
                        showToast(`网络波动，正在重试 (${attempt + 1}/${retries})...`);
                        await new Promise(r => setTimeout(r, 1200));
                        continue;
                    }
                    throw lastErr;
                }
            }
            throw lastErr;
        }

                    case '智能调优':

                    default: userMessage = extraContext;
                }
                // === 📚 数据库知识注入引擎：将已开启的知识库条目作为底层世界观规则注入 ===
                const activeDatabaseItems = knowledgeDatabase.filter(item => item && item.enabled);
                if (activeDatabaseItems.length > 0) {
                    let dbContextStr = activeDatabaseItems.map(item => `[资料库:${item.name}]\n${item.content}`).join('\n\n');
                    const dbPrompt = `\n\n【⚠️ 全局数据库参考指南】\n以下是本世界观的底层数据库资料。你在进行任何设定创作、改写或逻辑推演时，必须严格参考以下资料，确保数据来源与技术路线的绝对统一：\n${dbContextStr}`;
                    apiMessages.push({ role: 'system', content: dbPrompt });
                }
                // 🎓 近因效应注入：将已学习的自定义格式约束作为最高优先级 System 指令植入（紧贴用户消息）
                const learnedGuide = buildLearnedFormatInstructions();
                if (learnedGuide) {
                    apiMessages.push({ role: 'system', content: learnedGuide });
                }
                apiMessages.push({ role: 'user', content: userMessage });
            }

            showToast('正在呼叫 AI 处理中...');
            const statusIndicator = document.getElementById('aiStatusIndicator');
            if (statusIndicator) statusIndicator.style.display = 'flex';

            const startTime = Date.now();

            try {
                // 1. 组装发给大模型的标准载荷（动态加入 stream 与高阶采样参数）
                const payload = {
                    model: config.model,
                    messages: apiMessages,
                    stream: !!config.stream // 核心指令：告诉 AI 用流式传输
                };
                // 🚀 核心注入：挂载工具箱（原生 Function Calling / Tool Calling）
                if (tools && Array.isArray(tools)) payload.tools = tools;
                // 🚀 注入高阶采样参数（仅在用户配置了时才加入，避免不兼容接口报错）
                if (config.max_tokens) payload.max_tokens = config.max_tokens;
                if (config.temperature !== undefined) payload.temperature = config.temperature;
                if (config.top_p !== undefined) payload.top_p = config.top_p;
                if (config.frequency_penalty !== undefined) payload.frequency_penalty = config.frequency_penalty;
                if (config.presence_penalty !== undefined) payload.presence_penalty = config.presence_penalty;
                if (config.n && config.n > 1) payload.n = config.n;

                const response = await fetchWithRetry(`${config.api_base}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.api_key}`
                    },
                    body: JSON.stringify(payload)
                });

                const duration = Date.now() - startTime;

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `HTTP 错误: ${response.status}`);
                }

                // 2. 核心分流处理：解析大模型返回的数据（流式 / 非流式双轨）
                let rawContent = '';
                let toolCallsAcc = {}; // 工具调用参数累加器：流式切片的参数 JSON 实时组装
                let totalTokens = 0;
                if (config.stream) {
                    // 【流式处理模式】逐块读取 SSE 数据并拼接为完整文本
                    // 🚀 防御：部分代理/防火墙会返回空 body（如 200 但 body=null），防止 getReader() 崩溃
                    if (!response.body) throw new Error('API 返回了空响应体，可能是代理或防火墙拦截了流式数据。请尝试关闭流式传输或检查网络。');
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });

                        // 按换行符切割，最后一段可能不完整留到下一轮
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';
                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (!trimmed) continue;
                            // 忽略流结束的标识符
                            if (trimmed.includes('[DONE]')) continue;
                            // 解析前缀为 "data: " 的标准 SSE 格式
                            if (trimmed.startsWith('data:')) {
                                try {
                                    const dataObj = JSON.parse(trimmed.replace('data:', '').trim());
                                    const delta = dataObj.choices && dataObj.choices[0] ? (dataObj.choices[0].delta || {}) : {};
                                    // 1. 常规文本流：逐块拼接并触发回调（打字机效果，告别“死机等待”）
                                    const deltaContent = delta.content || '';
                                    if (deltaContent) {
                                        rawContent += deltaContent;
                                        if (onStreamChunk) onStreamChunk(rawContent, false);
                                    }
                                    // 2. 原生函数调用流 (Function Calling)：实时组装被切成碎片的参数 JSON
                                    if (delta.tool_calls && Array.isArray(delta.tool_calls)) {
                                        delta.tool_calls.forEach(tc => {
                                            const idx = tc.index !== undefined ? tc.index : 0;
                                            if (!toolCallsAcc[idx]) toolCallsAcc[idx] = { id: tc.id || '', type: 'function', function: { name: '', arguments: '' } };
                                            if (tc.function && tc.function.name) toolCallsAcc[idx].function.name += tc.function.name;
                                            if (tc.function && tc.function.arguments) {
                                                toolCallsAcc[idx].function.arguments += tc.function.arguments;
                                                // 触发 UI 提示正在调用函数（文本为空时显示动态装配动画）
                                                if (onStreamChunk) onStreamChunk(rawContent, true);
                                            }
                                        });
                                    }
                                } catch (err) {
                                    console.warn('流式解析跳过无法解析的片段:', trimmed);
                                }
                            }
                        }
                    }
                } else {
                    // 【传统非流式模式】
                    const data = await response.json();
                    const usage = data.usage || {};
                    totalTokens = usage.total_tokens || 0;
                    const msg0 = data.choices[0].message;
                    rawContent = msg0.content || '';
                    // 非流式也可能直接返回完整的工具调用
                    if (msg0.tool_calls && Array.isArray(msg0.tool_calls)) {
                        msg0.tool_calls.forEach((tc, idx) => { toolCallsAcc[idx] = tc; });
                    }
                }
                rawContent = String(rawContent || '').trim();

                apiLogs.unshift({
                    time: new Date().toLocaleString('zh-CN', { hour12: false }),
                    model: config.model,
                    action: actionType,
                    tokens: totalTokens,
                    durationMs: duration,
                    status: '成功',
                    detail: `执行 [${actionType}] 任务`
                });
                if (apiLogs.length > 50) apiLogs.pop();
                saveToLocal();

                // 智能调优：强力洗稿后解析 JSON，静默覆盖条目参数并刷新界面
                if (actionType === '智能调优') {
                    try {
                        // 强力洗稿：防止大模型输出带 ```json 代码块或多余文字
                        const optimizedEntries = extractJsonArray(rawContent);
                        if (!Array.isArray(optimizedEntries)) throw new Error("未能提取到合法 JSON 数组");
                        const entriesArr = getEntriesArray();
                        let updatedCount = 0;
                        optimizedEntries.forEach(aiEntry => {
                            const idx = entriesArr.findIndex(e => String(e.uid) === String(aiEntry && aiEntry.uid));
                            if (idx > -1) {
                                const pos = mapPositionValue(aiEntry.position);
                                if (pos !== null) entriesArr[idx].position = pos;
                                if (aiEntry.depth !== undefined && aiEntry.depth !== null) entriesArr[idx].depth = parseInt(aiEntry.depth) || entriesArr[idx].depth;
                                if (aiEntry.order !== undefined && aiEntry.order !== null) entriesArr[idx].order = parseInt(aiEntry.order) || entriesArr[idx].order;
                                // 触发概率 / 触发逻辑 / 防递归
                                if (aiEntry.probability !== undefined && aiEntry.probability !== null) entriesArr[idx].probability = parseInt(aiEntry.probability) || entriesArr[idx].probability;
                                if (aiEntry.selectiveLogic !== undefined && aiEntry.selectiveLogic !== null) entriesArr[idx].selectiveLogic = parseInt(aiEntry.selectiveLogic) || entriesArr[idx].selectiveLogic;
                                if (aiEntry.excludeRecursion !== undefined && aiEntry.excludeRecursion !== null) entriesArr[idx].excludeRecursion = Boolean(aiEntry.excludeRecursion);
                                // 🆕 ST 扩展字段：@D 角色 / 输出口 / 定时效果 / 匹配设置 / 递归
                                if (aiEntry.role !== undefined && aiEntry.role !== null) entriesArr[idx].role = parseInt(aiEntry.role) || 0;
                                if (aiEntry.outlet_name !== undefined) entriesArr[idx].outlet_name = String(aiEntry.outlet_name || '');
                                if (aiEntry.sticky !== undefined && aiEntry.sticky !== null) entriesArr[idx].sticky = parseInt(aiEntry.sticky) || 0;
                                if (aiEntry.cooldown !== undefined && aiEntry.cooldown !== null) entriesArr[idx].cooldown = parseInt(aiEntry.cooldown) || 0;
                                if (aiEntry.delay !== undefined && aiEntry.delay !== null) entriesArr[idx].delay = parseInt(aiEntry.delay) || 0;
                                if (aiEntry.case_sensitive !== undefined) entriesArr[idx].case_sensitive = Boolean(aiEntry.case_sensitive);
                                if (aiEntry.match_whole_words !== undefined) entriesArr[idx].match_whole_words = Boolean(aiEntry.match_whole_words);
                                if (aiEntry.prevent_recursion !== undefined) entriesArr[idx].prevent_recursion = Boolean(aiEntry.prevent_recursion);
                                if (aiEntry.delay_until_recursion !== undefined) entriesArr[idx].delay_until_recursion = Boolean(aiEntry.delay_until_recursion);
                                updatedCount++;
                            }
                        });
                        saveToLocal();
                        renderEntries();
                        renderEditor();
                        return `✅ 自动调优完成！已成功重排 ${updatedCount} 个条目的位置、深度、顺序、概率与逻辑。`;
                    } catch (err) {
                        console.error("智能调优 JSON 解析失败:", err, rawContent);
                        return "❌ 调优失败：AI 未能返回合法的 JSON 格式。请检查模型输出或重试。";
                    }
                }

                // 🚀 结构化返回：本次请求挂载了工具箱时，返回 { content, toolCalls } 供调用方解析
                if (tools && Array.isArray(tools)) {
                    const toolCallsArr = Object.values(toolCallsAcc);
                    return { content: rawContent, toolCalls: toolCallsArr.length > 0 ? toolCallsArr : null };
                }

                return rawContent;

            } catch (error) {
                const duration = Date.now() - startTime;
                apiLogs.unshift({
                    time: new Date().toLocaleString('zh-CN', { hour12: false }),
                    model: config.model,
                    action: actionType,
                    tokens: 0,
                    durationMs: duration,
                    status: '失败',
                    detail: error.message

                console.error("AI 请求出错:", error);
                alert(`AI 请求失败: ${error.message}`);
                return null;
            } finally {
                if (statusIndicator) statusIndicator.style.display = 'none';
            }
        }

        // ============================================================
        //  辅助管理函数
        // ============================================================
        // ============================================================
        //  修复版：自动分类标签引擎 (Auto-Tagging)
        // ============================================================
        // 核心标签判定函数：提取条目的分类类型 (Type String)
        function getEntryCategoryType(entry) {
            if (!entry) return 'none';
            // 🎯 手动标签优先：若用户手动设置了标签，直接采用（覆盖自动判定）
            const manualTag = entry.tag;
            if (manualTag && manualTag !== 'auto') {
                if (manualTag === 'none') return 'none';
                if (['char', 'loc', 'item', 'org', 'event'].includes(manualTag)) return manualTag;
            }
            // 防御性编程：防止导入的非标准数据 keys 不是数组，导致 .join() 报错白屏
            const keysText = Array.isArray(entry.keys) ? entry.keys.join(' ') : String(entry.keys || '');
            const commentText = String(entry.comment || entry.name || '');
            const contentText = String(entry.content || '');
            const textToAnalyze = (keysText + ' ' + commentText + ' ' + contentText).toLowerCase();

            // 词库大换血：剔除极易误触的单字（他、她、男、女、he、she），改用高精度特征词
            const rules = [
                { type: 'char', keywords: ['角色', '人物', '国王', '法师', '战士', '外貌', '性格', '性格特点', '年龄', '身份', 'character', 'appearance', 'personality'] },
                { type: 'loc', keywords: ['地点', '位置', '城市', '大陆', '王国', '山脉', '位于', '地形', '气候', '首都', 'location', 'city', 'region', 'continent'] },
                { type: 'item', keywords: ['物品', '武器', '神器', '道具', '材料', '装备', '效果', '制造', '材质', 'item', 'weapon', 'artifact', 'equipment'] },
                { type: 'org', keywords: ['组织', '阵营', '势力', '教会', '公会', '骑士团', '家族', '成员', '宗旨', 'organization', 'faction', 'guild', 'cult'] },
                { type: 'event', keywords: ['历史', '事件', '年代', '纪元', '战争', '发生于', '导致', '时代', '爆发', 'history', 'event', 'era'] }
            ];

            for (let rule of rules) {
                for (let kw of rule.keywords) {
                    // 英文单词边界保护：利用 \b 防止 "the" 误触发 "he"
                    if (/^[a-z]+$/.test(kw)) {
                        const regex = new RegExp('\\b' + kw + '\\b', 'i');
                        if (regex.test(textToAnalyze)) return rule.type;
                    } else {
                        // 中文词组直接匹配（因为已移除单字，误触率极低）
                        if (textToAnalyze.includes(kw)) return rule.type;
                    }
                }
            }
            return 'none'; // 未匹配到任何分类
        }

        // 🧠 核心：万能标签解析器（统一数据格式）
        // 🎨 1. 根据标签名称动态生成独一无二且好看的 HSL 高亮色彩
        function getHashColorStyle(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash) % 360; // 0~360 度绚丽色相
            return {
                bg: `hsla(${hue}, 55%, 22%, 0.45)`,        // 半透明深色背景
                border: `hsla(${hue}, 65%, 50%, 0.55)`,    // 高亮边框
                color: `hsla(${hue}, 85%, 82%, 1)`         // 柔和高亮文字
            };
        }

        // 🧠 2. 升级版万能标签解析器（支持原生分类高亮 + 自定义标签多彩哈希）
        function parseTagObj(rawTag) {
            if (!rawTag) return { icon: '⚪', name: '未标记', cssClass: '', inlineStyle: '' };

            let str = String(rawTag).trim();
            if (str.startsWith('builtin:')) str = str.replace('builtin:', '');

            let icon = '', name = str;
            if (str.includes('|')) {
                const parts = str.split('|');
                icon = parts[0];
                name = parts.slice(1).join('|');
            }

            const cleanName = name.replace(/^[🎯👤📍⚔️🛡️📜⚪📌]\s*/, '').trim();

            // 经典系统分类的专属高亮映射
            const builtInMap = {
                'char':  { icon: '👤', name: '人物', cssClass: 'cat-char' },
                '人物':  { icon: '👤', name: '人物', cssClass: 'cat-char' },
                'loc':   { icon: '📍', name: '地点', cssClass: 'cat-loc' },
                '地点':  { icon: '📍', name: '地点', cssClass: 'cat-loc' },
                'item':  { icon: '⚔️', name: '物品', cssClass: 'cat-item' },
                '物品':  { icon: '⚔️', name: '物品', cssClass: 'cat-item' },
                'org':   { icon: '🛡️', name: '阵营', cssClass: 'cat-org' },
                '阵营':  { icon: '🛡️', name: '阵营', cssClass: 'cat-org' },
                'event': { icon: '📜', name: '历史', cssClass: 'cat-event' },
                '历史':  { icon: '📜', name: '历史', cssClass: 'cat-event' }
            };

            if (builtInMap[str] || builtInMap[cleanName]) {
                const target = builtInMap[str] || builtInMap[cleanName];
                return {
                    icon: icon || target.icon,
                    name: target.name,
                    cssClass: target.cssClass,
                    inlineStyle: '' // 使用 CSS 类中的原生高亮
                };
            }

            // 🌟 自定义标签：动态计算专属缤纷色彩！
            const dynColor = getHashColorStyle(cleanName || name);
            return {
                icon: icon || '📌',
                name: name,
                cssClass: 'cat-dynamic',
                inlineStyle: `background:${dynColor.bg}; border-color:${dynColor.border}; color:${dynColor.color};`
            };
        }

        // 📋 2. 中间栏条目列表标签预览渲染（同步五彩缤纷）
        function getEntryCategoryTag(entry) {
            if (!entry) return '';
            const allTags = [];

            if (entry.tag && entry.tag !== 'auto' && entry.tag !== 'none') {
                allTags.push(`builtin:${entry.tag}`);
            }
            if (Array.isArray(entry.tags)) {
                entry.tags.forEach(t => {
                    if (t && !allTags.includes(t)) allTags.push(t);
                });
            }

            return allTags.map(rawTag => {
                const tagObj = parseTagObj(rawTag);
                return `<span class="tag-chip ${tagObj.cssClass}" style="${tagObj.inlineStyle}">${tagObj.icon} ${escHtml(tagObj.name)}</span>`;
            }).join(' ');
        }

        // 🏷️ 首次使用自动种子系统标签（下拉与筛选共用，保证同步就绪）
        function seedDefaultTags() {
            if (globalCustomTags.length === 0 && !window.hasSeededTags && !localStorage.getItem('wb_custom_tags_seeded')) {
                globalCustomTags = [
                    { icon: '👤', name: '人物' }, { icon: '📍', name: '地点' },
                    { icon: '⚔️', name: '物品' }, { icon: '🛡️', name: '阵营' }, { icon: '📜', name: '历史' }
                ];
                window.hasSeededTags = true;
                try { localStorage.setItem('wb_custom_tags_seeded', '1'); } catch (e) {}
                saveToLocal(); // 持久化种子标签库
            }
        }

        // 1. 生成绝对自由的下拉列表（打通系统与自定义）
        function renderTagOptions(entry) {
            seedDefaultTags(); // 🆕 确保标签库就绪

            // 保留两个不可删除的核心系统功能项
            let html = `
                <option value="builtIn:auto" ${entry.tag === 'auto' ? 'selected' : ''}>🎯 自动判定 (交由AI)</option>
                <option value="builtIn:none" ${entry.tag === 'none' ? 'selected' : ''}>⚪ 未标记</option>
                <option disabled>── 你的标签库 ──</option>
            `;

            // 渲染所有标签（无论是以前的系统标签还是你自己建的，都在这里）
            globalCustomTags.forEach(ct => {
                html += `<option value="custom:${ct.icon}|${ct.name}"> ${ct.icon} ${ct.name}</option>`;
            });

            // 兼容以前用旧版系统标签写的老条目
            const legacyMap = { 'char': '👤 人物', 'loc': '📍 地点', 'item': '⚔️ 物品', 'org': '🛡️ 阵营', 'event': '📜 历史' };
            if (legacyMap[entry.tag]) {
                html += `<option value="builtIn:${entry.tag}" selected>${legacyMap[entry.tag]} (旧版遗留，建议重新选择)</option>`;
            }

            html += `<option disabled>──────────</option>`;
            html += `<option value="add_new">➕ 新建带图标的标签...</option>`;
            html += `<option value="manage_tags">⚙️ 管理/删除标签库...</option>`;

        // 监听下拉框选择，智能去重，绝不重复堆积标签
        function handleEntryTagSelect(el) {
            const entry = getCurrentEntry();
            if (!entry) return;
            const val = el.value;

            if (val === 'add_new') {
                showCreateCustomTagModal();

                return;

            if (!Array.isArray(entry.tags)) entry.tags = [];

            if (val.startsWith('builtIn:')) {
                const cat = val.split(':')[1];

            } else if (val.startsWith('custom:')) {
                const tagStr = val.split(':')[1]; // 格式 "Emoji|名称"
                // 🔒 严格去重检查：只有当前条目还没有这个标签时才添加
                if (!entry.tags.includes(tagStr)) {
                    entry.tags.push(tagStr);
                }
            }

            saveToLocal();
            renderEntries();
            renderEditor();
        }

        // 🏷️ 1. 编辑区标签徽章渲染（应用动态色彩 + 删除按钮）
        function renderEntryCustomTagChips(entry) {
            if (!entry) return '';
            const allTags = [];

            if (entry.tag && entry.tag !== 'auto' && entry.tag !== 'none') {
                allTags.push(`builtin:${entry.tag}`);
            }
            if (Array.isArray(entry.tags)) {
                entry.tags.forEach(t => {
                    if (t && !allTags.includes(t)) allTags.push(t);
                });
            }

            if (allTags.length === 0) {
                return '<span style="font-size:11px;color:var(--text-muted);">（当前暂未挂载任何标签）</span>';
            }

            return allTags.map(rawTag => {
                const tagObj = parseTagObj(rawTag);
                const safeTagStr = escHtml(rawTag).replace(/'/g, "\\'");
                return `<span class="tag-chip ${tagObj.cssClass}" style="${tagObj.inlineStyle}">
                    ${tagObj.icon} ${escHtml(tagObj.name)}
                    <span class="remove-btn" onclick="removeTagFromEntry('${safeTagStr}')" title="移除此标签">×</span>
                </span>`;
            }).join('');
        }

        // 🗑️ 终极万能删除函数：彻底解决“旧标签删不掉”的问题
        function removeTagFromEntry(tagToRemove) {
            const entry = getCurrentEntry();
            if (!entry) return;

            if (tagToRemove.startsWith('builtin:')) {
                // 如果删的是旧系统主分类，把 entry.tag 清空/重置
                entry.tag = 'none';
            } else {
                // 如果删的是 entry.tags 数组里的标签
                if (Array.isArray(entry.tags)) {
                    entry.tags = entry.tags.filter(t => t !== tagToRemove);
                }
                // 如果 entry.tag 刚好也等于这个自定义标签，一并清空
                if (entry.tag === tagToRemove) {
                    entry.tag = 'none';
                }
            }

            saveToLocal();   // 保存持久化
            renderEntries(); // 刷新中间栏条目列表
            renderEditor();  // 刷新右侧编辑器
        }

        // 6. 更新顶部分类筛选的选项（你的标签库 + 旧版遗留分类）
        function refreshTagFilterOptions() {

        // 将酒馆式位置字符串映射为应用内的数字 position 枚举（SillyTavern 官方枚举）
        // 0=角色定义之前 1=角色定义之后 2=示例消息之前 3=示例消息之后 4=作者注记顶部 5=作者注记底部 6=@D深度 7=输出口
        function mapPositionValue(pos) {
            if (typeof pos === 'number') return (pos >= 0 && pos <= 7) ? pos : null;
            const s = String(pos || '').trim().toLowerCase();
            if (['角色定义之前', '主提示前', 'before char', 'before_char', 'before main', 'beforemain', 'before_main'].includes(s)) return 0;
            if (['角色定义之后', '主提示后', 'after char', 'after_char', 'after main', 'aftermain', 'after_main'].includes(s)) return 1;
            if (['示例消息之前', '示例顶部', 'before example', 'before_example'].includes(s)) return 2;
            if (['示例消息之后', '示例底部', 'after example', 'after_example'].includes(s)) return 3;
            if (['作者注记顶部', '注释顶部', 'top an', 'top_an', 'top of authors note'].includes(s)) return 4;
            if (['作者注记底部', '注释底部', 'bottom an', 'bottom_an', 'bottom of authors note'].includes(s)) return 5;
            if (['@d', '@d 深度', '@d 系统', '@d 用户', '@d 助手', 'at depth', 'at_depth', '深度', 'dynamic'].includes(s)) return 6; // @D → 官方枚举 6
            if (['输出口', 'outlet', 'output', '出口'].includes(s)) return 7;
            return null; // 无法识别则保持原位置不变
        }

        // 将 position 枚举转为世界书文字名称（便于界面与 AI 快照辨认）
        function positionLabel(p) {
            const map = {
                0: '角色定义之前', 1: '角色定义之后', 2: '示例消息之前', 3: '示例消息之后',
                4: '作者注记顶部', 5: '作者注记底部', 6: '@D', 7: '输出口'
            };
            return map[p] !== undefined ? map[p] : String(p);
        }

        // role 枚举 → 文字（@D 深度的角色分配）
        function roleLabel(r) {
            const map = { 0: '⚙️ 系统', 1: '👤 用户', 2: '🤖 助手' };
            return map[r] !== undefined ? map[r] : '⚙️ 系统';
        }

        function getCurrentWorldbook() { return worldbooks.find(w => w.uid === currentWorldbookUid) || worldbooks[0]; }
        function getCurrentEntry() {

            if (first) currentEntryUid = first.uid;
            return first;

        // ============================================================

        // ============================================================

        // ============================================================
        function handleImportWorldbook() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json, .yaml, .yml, .txt, .md';
            input.onchange = function (e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function (ev) {
                    const text = ev.target.result.trim();
                    try {
                        // 1. 尝试作为 JSON 解析
                        const data = JSON.parse(text);
                        if (Array.isArray(data)) {
                            // 格式 2: 纯 JSON 数组格式
                            importFromArray(data, file.name);
                        } else if (data && typeof data === 'object' && data.entries) {
                            // 格式 3: SillyTavern 标准格式 (自带 entries 对象)
                            importFromStandardJSON(data, file.name);
                        } else {
                            throw new Error('缺少必要的 JSON 结构 (如 entries 对象或数组)');
                        }
                    } catch (err) {
                        // 2. 兜底策略：尝试解析 YAML/Markdown 格式
                        try {
                            const entries = parseYamlLikeFormat(text);
                            if (entries.length > 0) {
                                importFromParsedEntries(entries, file.name);
                            } else {
                                alert('导入失败: 无法识别 JSON 格式，且未匹配到 YAML 条目结构。\n内部报错: ' + err.message);
                            }
                        } catch (yamlErr) {
                            alert('导入失败: 数据解析异常。\n' + err.message);
                        }
                    }

            };

        // 解析格式 1 (YAML 或 Markdown 代码块中的 YAML)
        function parseYamlLikeFormat(text) {
            const entries = [];
            const entryBlockRegex = /trigger:\s*\n([\s\S]*?)content:\s*\|?\s*\n([\s\S]*?)(?=\n\s*uid:|\n\s*trigger:|\n\s*```|$)/gi;
            let match;
            while ((match = entryBlockRegex.exec(text)) !== null) {
                const triggerBlock = match[1];
                let contentBlock = match[2];
                const titleMatch = triggerBlock.match(/Title:\s*"?([^"\n]+)"?/i);
                const keysMatch = triggerBlock.match(/Comma_separated_list:\s*"?([^"\n]+)"?/i);
                let keysStr = keysMatch ? keysMatch[1] : (titleMatch ? titleMatch[1] : '未命名');
                let keys = keysStr.split(',').map(k => k.trim()).filter(Boolean);
                if (keys.length === 0) keys = ['未命名'];
                let content = contentBlock.replace(/```\s*$/g, '').trim();

                entries.push({
                    keys: keys, content: content, constant: false, disable: false,
                    order: entries.length, selectiveLogic: 0, excludeRecursion: false,
                    probability: 100, depth: 4, position: 1, role: 0
                });
            }
            return entries; // 修复了这里的死代码 BUG (ASI 换行陷阱)
        }

        // 解析格式 2 (JSON 数组)
        function importFromArray(arr, fileName) {
            const newWb = {
                uid: Date.now(), name: fileName.replace(/\.[^/.]+$/, "") || '导入的世界书 (数组)',
                description: '从 JSON 数组导入', scan_depth: 4, token_budget: 2048, recursive_scanning: true, entries: {}
            };
            arr.forEach((item, index) => {
                const newUid = Date.now() + index;
                // 【核心容错】合并各种可能的关键字字段
                let combinedKeys = [];
                if (Array.isArray(item.keys)) combinedKeys = combinedKeys.concat(item.keys);
                if (Array.isArray(item.keys2)) combinedKeys = combinedKeys.concat(item.keys2);
                if (Array.isArray(item.key)) combinedKeys = combinedKeys.concat(item.key);
                if (typeof item.key === 'string') combinedKeys.push(item.key);
                if (combinedKeys.length === 0 && item.title) combinedKeys.push(item.title);
                if (combinedKeys.length === 0 && item.name) combinedKeys.push(item.name);
                if (combinedKeys.length === 0) combinedKeys.push('未命名');

                newWb.entries[newUid] = {
                    uid: newUid, keys: combinedKeys, content: item.content || '',
                    constant: item.constant === true, disable: item.on === false,
                    order: item.order !== undefined ? item.order : index,
                    selectiveLogic: 0, excludeRecursion: false,
                    probability: item.prob !== null && item.prob !== undefined ? item.prob : 100,
                    depth: item.depth !== undefined ? item.depth : 4, position: 1, role: 0

        // 解析格式 3 (SillyTavern 标准)
        function importFromStandardJSON(data, fileName) {
            const newWb = {
                uid: Date.now(), name: data.name || fileName.replace(/\.[^/.]+$/, ''),
                description: data.description || '', scan_depth: data.scan_depth || 4,
                token_budget: data.token_budget || 2048, recursive_scanning: data.recursive_scanning ?? true,
                entries: data.entries || {}
            };
            let entryCount = 0;
            for (let key in newWb.entries) {
                const entry = newWb.entries[key];
                if (!entry.uid) entry.uid = Date.now() + entryCount;

                // 【核心容错】拦截处理旧版或其它工具导出的非标准字段
                let combinedKeys = [];
                if (Array.isArray(entry.keys)) combinedKeys = combinedKeys.concat(entry.keys);
                else if (typeof entry.keys === 'string') combinedKeys.push(entry.keys);
                if (Array.isArray(entry.key)) combinedKeys = combinedKeys.concat(entry.key);
                else if (typeof entry.key === 'string') combinedKeys.push(entry.key);
                if (combinedKeys.length === 0 && entry.title) combinedKeys.push(entry.title);
                if (combinedKeys.length === 0 && entry.name) combinedKeys.push(entry.name);
                if (combinedKeys.length === 0) combinedKeys.push('未命名');

                entry.keys = combinedKeys; // 强制覆盖为安全的数组
                // 补全其它可能缺失的参数
                entry.content = entry.content || '';
                entry.order = entry.order !== undefined ? entry.order : entryCount;
                entryCount++;
            }
            finalizeImport(newWb, entryCount);
        }

        // 解析格式 1 的辅助装填
        function importFromParsedEntries(entriesList, fileName) {
            const newWb = {
                uid: Date.now(), name: fileName.replace(/\.[^/.]+$/, "") || '导入的世界书 (YAML)',

        // 统一处理导入完成后的状态和 UI 刷新
        function finalizeImport(newWb, entryCount) {
            worldbooks.push(newWb);

            const entries = Object.values(newWb.entries || {}); // 使用实际条目重定位
            currentEntryUid = entries.length ? entries[0].uid : null;

        // ============================================================
        //  拖拽排序逻辑
        // ============================================================
        function handleDragStart(e) { draggedUid = parseInt(e.currentTarget.dataset.uid); draggedSourceWbUid = currentWorldbookUid; e.dataTransfer.effectAllowed = 'move'; setTimeout(() => e.target.style.opacity = '0.4', 0); }
        function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; const target = e.currentTarget; if (target && parseInt(target.dataset.uid) !== draggedUid) { target.style.borderTop = '2px solid var(--accent)'; } }
        function handleDragLeave(e) { e.currentTarget.style.borderTop = '1px solid transparent'; }
        function handleDrop(e) {
            e.preventDefault(); e.currentTarget.style.borderTop = '1px solid transparent';
            const targetUid = parseInt(e.currentTarget.dataset.uid);
            if (draggedUid === targetUid || !draggedUid) return;
            const entries = getEntriesArray();
            entries.sort((a, b) => a.order - b.order);
            const draggedIndex = entries.findIndex(item => String(item.uid) === String(draggedUid));
            const targetIndex = entries.findIndex(item => String(item.uid) === String(targetUid));
            if (draggedIndex > -1 && targetIndex > -1) {
                const [draggedItem] = entries.splice(draggedIndex, 1);
                entries.splice(targetIndex, 0, draggedItem);
                entries.forEach((item, idx) => { item.order = idx; });
                setEntriesArray(entries); saveToLocal(); renderAll();
                // 拖拽完成后自动复位排序下拉框为「默认/拖拽」，与手动排序和平共处
                entrySortMode = 'manual';

        // ============================================================
        //  跨世界书拖拽：把条目拖到左侧世界书项上即可移动到该世界书
        // ============================================================
        function handleDragOverWorldbook(e, wbUid) {
            e.preventDefault();

        function handleDragLeaveWorldbook(e) {

        function handleDropWorldbook(e, targetWbUid) {
            e.preventDefault();
            e.currentTarget.classList.remove('drop-target');
            if (!draggedUid || targetWbUid === draggedSourceWbUid) { draggedUid = null; draggedSourceWbUid = null; return; }
            const srcWb = worldbooks.find(w => w.uid === draggedSourceWbUid);
            const dstWb = worldbooks.find(w => w.uid === targetWbUid);
            if (!srcWb || !dstWb) { draggedUid = null; draggedSourceWbUid = null; return; }
            const entry = srcWb.entries[String(draggedUid)];
            if (!entry) { draggedUid = null; draggedSourceWbUid = null; return; }
            // 1. 从源世界书移除，并重新编号剩余条目
            delete (srcWb.entries || {})[String(draggedUid)];
            Object.values(srcWb.entries || {}).forEach((it, i) => { it.order = i; });
            // 2. 加入目标世界书（重新生成 uid 防止跨书冲突）
            if (!dstWb.entries) dstWb.entries = {};
            const newUid = Date.now() + Object.keys(dstWb.entries).length;
            entry.uid = newUid;
            dstWb.entries[newUid] = entry;
            Object.values(dstWb.entries).forEach((it, i) => { it.order = i; });
            // 3. 调整当前选中条目
            if (targetWbUid === currentWorldbookUid) {
                currentEntryUid = newUid;
            } else if (currentWorldbookUid === draggedSourceWbUid) {
                const curArr = Object.values(srcWb.entries || {});
                currentEntryUid = curArr.length ? curArr[0].uid : null;
            }

            renderAll();
            showToast('条目已移动到目标世界书');

            draggedSourceWbUid = null;

        function renderEntries() {
            const container = document.getElementById('entryContainer');
            let entries = getEntriesArray();
            // 根据当前排序模式应用排序（下拉菜单 / 拖拽复位后回默认）
            switch (entrySortMode) {
                case 'order_desc':
                    entries.sort((a, b) => (b.order || 100) - (a.order || 100));
                    break;
                case 'order_asc':
                    entries.sort((a, b) => (a.order || 100) - (b.order || 100));
                    break;
                case 'depth_desc':
                    entries.sort((a, b) => (b.depth || 0) - (a.depth || 0));
                    break;
                case 'name_asc':
                    entries.sort((a, b) => {
                        const nameA = (a.keys && a.keys.length > 0) ? a.keys[0].toString() : '';
                        const nameB = (b.keys && b.keys.length > 0) ? b.keys[0].toString() : '';
                        return nameA.localeCompare(nameB, 'zh-CN'); // 支持中文拼音排序
                    });
                    break;
                case 'manual':
                default:
                    entries.sort((a, b) => a.order - b.order);
                    break;
            }
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                entries = entries.filter(e => {
                    const titleText = String(e.comment || e.name || '').toLowerCase();
                    const keysText = (e.keys || []).join(' ').toLowerCase();
                    return titleText.includes(q) || keysText.includes(q) || String(e.content || '').toLowerCase().includes(q);
                });
            }
            // 🏷️ 标签分类过滤（与关键词搜索形成双重过滤）
            refreshTagFilterOptions(); // 🆕 动态刷新筛选下拉（内置分类 + 自定义标签）
            const tagFilterSelect = document.getElementById('tag-filter-select');
            const filterType = tagFilterSelect ? tagFilterSelect.value : 'all';
            if (filterType !== 'all') {
                entries = entries.filter(e => {
                    if (filterType === 'untagged') { const type = getEntryCategoryType(e); return type === 'none'; } // 筛选未分类条目
                    if (filterType.startsWith('tag:')) {
                        // 🆕 按自定义标签筛选
                        const tagName = filterType.slice(4);
                        return Array.isArray(e.tags) && e.tags.includes(tagName);
                    }
                    const type = getEntryCategoryType(e);
                    return type === filterType;
                });
            }
            if (entries.length === 0) { container.innerHTML = `<div class="text-muted text-sm" style="padding:10px;">没有匹配的条目</div>`; return; }

            container.innerHTML = entries.map(e => {
                // ★ 优先使用条目名称 (comment/name) 作为显示标题，无名称时用第一个关键词兜底
                const displayTitle = e.comment || e.name || (e.keys && e.keys[0]) || '未命名';
                return `
                <div class="entry-item ${String(e.uid) === String(currentEntryUid) ? 'active' : ''}"
                     draggable="true" data-uid="${e.uid}" ondragstart="handleDragStart(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)"
                     onclick="switchEntry('${e.uid}')">
                    <div class="info">
                        <div class="title">${getEntryCategoryTag(e)}${highlightText(displayTitle, searchQuery.trim())} <span style="font-size:10px;color:var(--text-muted);font-weight:normal;">(序:${e.order})</span></div>
                        <div class="keys">${highlightText((e.keys || []).join(', '), searchQuery.trim())}</div>
                    </div>
                    <div class="status">
                        <span class="status-dot ${e.constant ? 'blue' : 'green'}"></span>
                    </div>
                </div>`;
            }).join('');

            if (entries.length > 0 && !entries.some(e => String(e.uid) === String(currentEntryUid))) { switchEntry(entries[0].uid); }
        }

        // ==========================================
        // 🚀 核心功能：知识图谱可视化引擎（星图）
        // ==========================================
        let myGraphChart = null;

        function openGraph() {
            // 防御：ECharts CDN 未加载时给出提示而非崩溃
            if (typeof echarts === 'undefined') {
                showToast('ECharts 加载失败：请检查网络后刷新重试');
                return;
            }
            const wb = getCurrentWorldbook();
            if (!wb || !wb.entries || Object.keys(wb.entries).length === 0) {
                showToast("当前世界书为空，无法生成星图！");
                return;
            }

            // 显示全屏画布
            document.getElementById('graphModal').style.display = 'block';

            // 初始化 ECharts 实例
            if (!myGraphChart) {
                myGraphChart = echarts.init(document.getElementById('graphContainer'));

                // 监听窗口缩放防变形
                window.addEventListener('resize', () => {
                    if (document.getElementById('graphModal').style.display === 'block') myGraphChart.resize();
                });
            }

            const entries = getEntriesArray();
            const nodes = [];
            const links = [];

            // 1. 构建节点 (Nodes)
            entries.forEach(e => {
                const contentLen = String(e.content || '').length;
                // 节点大小：常驻设定最大，其他按字数智能缩放
                const size = e.constant ? 45 : (contentLen > 800 ? 35 : (contentLen > 200 ? 25 : 15));

                nodes.push({
                    id: String(e.uid),
                    name: (Array.isArray(e.keys) && e.keys[0]) ? e.keys[0] : '未命名',
                    symbolSize: size,
                    itemStyle: {
                        // 常驻条目显紫色，高权重(小 order)显金色，普通显青绿色
                        color: e.constant ? '#b48aff' : (e.order < 50 ? '#f9d77e' : '#7fe0b0'),
                        borderColor: 'rgba(255,255,255,0.2)',
                        borderWidth: 2
                    },
                    uid: e.uid // 隐藏携带 UID，用于点击跳转
                });
            });

            // 2. 神经连线扫描 (Links)：Source 正文是否包含 Target 的关键词
            entries.forEach(source => {
                const sourceText = String(source.content || '').toLowerCase();
                entries.forEach(target => {
                    if (source.uid === target.uid) return;

                    const targetKeys = Array.isArray(target.keys) ? target.keys : [];
                    let hasLink = false;

                    for (let k of targetKeys) {
                        const kw = String(k).toLowerCase().trim();
                        if (!kw) continue;
                        if (sourceText.includes(kw)) { hasLink = true; break; }
                    }

                    if (hasLink) {
                        links.push({
                            source: String(source.uid),
                            target: String(target.uid),
                            lineStyle: { width: 1.5, color: '#736f84', opacity: 0.5, curveness: 0.2 }
                        });
                    }
                });
            });

            // 3. 渲染配置
            const option = {
                backgroundColor: '#0f0e12', // 贴合暗色主题
                title: {
                    text: `🌐 ${wb.name || '未命名世界书'} - 神经拓扑星图`,
                    subtext: `共 ${nodes.length} 个设定节点，${links.length} 维关联`,
                    textStyle: { color: '#e8e6ed', fontSize: 20 },
                    subtextStyle: { color: '#736f84', fontSize: 14 },
                    top: 30, left: 30
                },
                tooltip: { formatter: '{b}' }, // 鼠标悬浮显示名字
                series: [{
                    type: 'graph',
                    layout: 'force',
                    force: { repulsion: 500, edgeLength: [80, 200], gravity: 0.1 }, // 引力与排斥力平衡
                    roam: true, // 开启鼠标漫游缩放
                    label: { show: true, position: 'right', color: '#a9a5b8' },
                    data: nodes,
                    links: links,
                    emphasis: {
                        focus: 'adjacency', // 悬浮时高亮相邻节点，其余变暗
                        lineStyle: { width: 4, opacity: 1 }
                    }
                }]
            };

            myGraphChart.setOption(option);

            // 4. 绑定点击事件：点击星星，直接跳转到对应条目的编辑器
            myGraphChart.off('click');
            myGraphChart.on('click', function (params) {
                if (params.dataType === 'node') {
                    closeGraph();          // 关闭星图
                    switchEntry(params.data.uid); // 跳转到对应条目编辑器
                }
            });
        }

            if (modal) modal.style.display = 'none';
